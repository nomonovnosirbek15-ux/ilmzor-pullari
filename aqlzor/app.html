<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Aqlzor kitob dökoni</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--ind:#23205E;--ind2:#3a3690;--amb:#F5A524;--bg:#f4f3f8;--card:#fff;--ink:#1b1a33;--ink2:#6b6a83;--line:#e6e4ef;--ok:#14845a;--bad:#c0392b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif}
button{font:inherit;cursor:pointer}
header{background:var(--ind);color:#fff;padding:14px 16px 12px;position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:10px}
.brand b{font-size:19px;letter-spacing:.2px}
.brand small{display:block;color:#c9c6f2;font-size:12px;margin-top:1px}
.tabs{display:flex;flex-wrap:wrap;gap:6px 8px;margin-top:10px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;border-radius:20px;padding:7px 12px;background:rgba(255,255,255,.12);color:#fff;font-weight:600;font-size:14px;white-space:nowrap}
.tab.on{background:var(--amb);color:var(--ind)}
main{padding:14px 12px 110px;max-width:720px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
.bk{background:var(--card);border-radius:14px;overflow:hidden;box-shadow:0 1px 4px rgba(35,32,94,.08);display:flex;flex-direction:column}
.cov{aspect-ratio:3/4;background:linear-gradient(150deg,var(--ind),var(--ind2));position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.cov img{width:100%;height:100%;object-fit:cover;display:block}
.cov .ph{color:#fff;text-align:center;padding:12px;font-weight:700;font-size:14px;line-height:1.25}
.cov .ph i{display:block;width:26px;height:4px;background:var(--amb);border-radius:2px;margin:0 auto 10px}
.cov .badge{position:absolute;left:8px;top:8px;background:var(--amb);color:var(--ind);font-size:11px;font-weight:800;padding:3px 7px;border-radius:8px}
.bi{padding:10px 10px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.bt{font-weight:700;font-size:14px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pr{font-weight:800;color:var(--ind)}
.pr.soon{color:var(--ink2);font-weight:600;font-size:13px}
.sp{flex:1}
.add{border:0;border-radius:10px;background:var(--ind);color:#fff;font-weight:700;padding:9px 6px;width:100%}
.add.soft{background:#ecebf6;color:var(--ind)}
.step{display:flex;align-items:center;justify-content:space-between;background:#ecebf6;border-radius:10px;overflow:hidden}
.step button{border:0;background:none;width:38px;height:36px;font-size:20px;font-weight:700;color:var(--ind)}
.step span{font-weight:800}
.empty{text-align:center;color:var(--ink2);padding:40px 16px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 35%);z-index:6}
.bar .in{max-width:720px;margin:0 auto;display:flex;gap:8px}
.big{flex:1;border:0;border-radius:14px;background:var(--amb);color:var(--ind);font-weight:800;font-size:16px;padding:14px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 4px 14px rgba(245,165,36,.35)}
.big:disabled{opacity:.6}
.big.ind{background:var(--ind);color:#fff;box-shadow:0 4px 14px rgba(35,32,94,.3)}
.ghostb{border:0;border-radius:14px;background:#fff;color:var(--ind);font-weight:700;padding:14px 16px;box-shadow:0 1px 4px rgba(35,32,94,.12)}
.card{background:var(--card);border-radius:14px;padding:14px;box-shadow:0 1px 4px rgba(35,32,94,.08);margin-bottom:12px}
h2{font-size:18px;margin:2px 0 12px}
h3{font-size:15px;margin:0 0 8px}
.ci{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.ci:last-child{border-bottom:0}
.ci .th{width:46px;height:60px;border-radius:6px;background:linear-gradient(150deg,var(--ind),var(--ind2));flex:none;overflow:hidden}
.ci .th img{width:100%;height:100%;object-fit:cover}
.ci .nm{flex:1;min-width:0}
.ci .nm b{display:block;font-size:14px;line-height:1.25}
.ci .nm small{color:var(--ink2)}
.ci .step{width:112px;flex:none}
.tot{display:flex;justify-content:space-between;font-size:17px;font-weight:800;margin-top:10px}
.note{color:var(--ink2);font-size:13px;margin-top:8px}
label{display:block;font-weight:700;font-size:13px;margin:12px 0 5px;color:var(--ind)}
input,select,textarea{width:100%;font:inherit;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;background:#fff;color:var(--ink);outline:0}
input:focus,select:focus,textarea:focus{border-color:var(--ind2)}
textarea{min-height:70px;resize:vertical}
.err{color:var(--bad);font-size:13px;margin-top:6px;min-height:1em;white-space:pre-line}
.seg{display:flex;background:#ecebf6;border-radius:10px;padding:3px;margin-top:4px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:8px;font-weight:700;color:var(--ink2);font-size:13px}
.seg button.on{background:#fff;color:var(--ind);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.ord{border-left:4px solid var(--amb)}
.ord .hd{display:flex;justify-content:space-between;font-weight:800}
.ord .st{display:inline-block;margin:6px 0;font-weight:700;font-size:13px;background:#f4f3f8;padding:4px 8px;border-radius:8px}
.ord ul{margin:4px 0 0;padding-left:18px;color:var(--ink2);font-size:13px}
.ok{text-align:center;padding:26px 16px}
.ok .ic{font-size:56px}
.sheet{position:fixed;inset:0;background:rgba(20,18,50,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet .in{background:#fff;border-radius:18px 18px 0 0;max-width:720px;width:100%;max-height:92vh;overflow:auto;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.sheet .cov{aspect-ratio:auto;height:280px;border-radius:12px}
.sheet .cov img{object-fit:contain;background:#efeef6}
.x{float:right;border:0;background:#ecebf6;border-radius:50%;width:32px;height:32px;font-size:16px;color:var(--ind)}
.navb{display:flex;gap:6px;margin-top:10px}
.navb button{border:0;background:rgba(255,255,255,.12);color:#fff;border-radius:10px;padding:6px 10px;font-weight:600;font-size:13px}
.navb button.on{background:#fff;color:var(--ind)}
.load{text-align:center;color:var(--ink2);padding:60px 0}
.navb{flex-wrap:wrap}
.srch{position:relative;margin:0 0 12px}
.srch input{padding-left:38px;border-radius:12px}
.srch span{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.6}
.badge.pdf{left:auto;right:8px;background:#fff;color:var(--ind)}
.paybox{background:#fff8e8;border:1.5px dashed var(--amb);border-radius:12px;padding:12px;white-space:pre-wrap;font-weight:600;margin:8px 0}
.pill{display:inline-block;background:#ecebf6;color:var(--ind);border-radius:8px;padding:2px 8px;font-size:12px;font-weight:800;margin-left:6px}
.pill.g{background:#e3f6ec;color:var(--ok)}.pill.y{background:#fff4d6;color:#a15c00}.pill.r{background:#fdeaea;color:var(--bad)}
.adm .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.adm .row button{flex:1;min-width:120px}
.btn2{border:0;border-radius:10px;padding:10px 12px;font-weight:700;background:var(--ind);color:#fff}
.btn2.soft{background:#ecebf6;color:var(--ind)}.btn2.ok{background:var(--ok)}.btn2.bad{background:#fdeaea;color:var(--bad)}
.ab{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ab:last-child{border-bottom:0}
.ab .th{width:40px;height:54px;border-radius:6px;background:linear-gradient(150deg,var(--ind),var(--ind2));flex:none;overflow:hidden}
.ab .th img{width:100%;height:100%;object-fit:cover}
.ab .nm{flex:1;min-width:150px;font-weight:700;font-size:14px;line-height:1.25}
.ab .nm small{display:block;font-weight:500;color:var(--ink2)}
.ab .ctl{display:flex;gap:6px;align-items:center;width:100%;padding-left:50px;flex-wrap:wrap}
.ab input{width:110px;padding:8px}
.kv{font-size:14px;line-height:1.55}
.kv b{color:var(--ind)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:0;border-radius:10px;background:#ecebf6;color:var(--ind);font-weight:700;padding:9px 12px;font-size:14px}
.q{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
.q:last-child{border-bottom:0}
.q .n{width:34px;font-weight:800;color:var(--ink2);flex:none}
.q .opts{display:flex;gap:6px;flex:1}
.q .opts button{flex:1;max-width:52px;height:40px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-weight:800;color:var(--ind)}
.q .opts button.on{background:var(--ind);color:#fff;border-color:var(--ind)}
.q .opts button.good{background:#e3f6ec;border-color:var(--ok);color:var(--ok)}
.q .opts button.bad{background:#fdeaea;border-color:var(--bad);color:var(--bad)}
.q .mk{width:26px;text-align:center;font-size:18px;flex:none}
.res{text-align:center}
.res .big2{font-size:40px;font-weight:900;color:var(--ind)}
.kgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.kgrid span{background:#f4f3f8;border-radius:8px;padding:6px 0;text-align:center;font-weight:700;font-size:14px}
.kgrid span b{color:var(--ind)}
.row2{display:flex;gap:8px;margin-top:12px}
.row2 button{flex:1}
.kb{display:flex;align-items:center;gap:12px;width:100%;border:0;text-align:left;background:var(--card);border-radius:14px;padding:10px;box-shadow:0 1px 4px rgba(35,32,94,.08);margin-bottom:10px;color:var(--ink)}
.kb .th{width:48px;height:64px;border-radius:8px;background:linear-gradient(150deg,var(--ind),var(--ind2));flex:none;overflow:hidden}
.kb .th img{width:100%;height:100%;object-fit:cover}
.kb .tx{flex:1;min-width:0}
.kb .tx b{display:block;font-size:15px;line-height:1.25}
.kb .tx small{color:var(--ink2)}
.kb .ar{font-size:22px;color:var(--ink2)}
.tl{display:flex;align-items:center;gap:10px;width:100%;border:0;text-align:left;background:none;padding:12px 2px;border-bottom:1px solid var(--line);color:var(--ink)}
.tl:last-child{border-bottom:0}
.tl .nn{width:38px;height:38px;border-radius:10px;background:#ecebf6;color:var(--ind);font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.tl .tt{flex:1;font-weight:600;line-height:1.3}
.tl .tt small{display:block;color:var(--ink2);font-weight:500}
/* ---- yangi joylashuv: pastki menyu, bo'lim kartalari, galereya ---- */
.tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:10px -16px -2px;padding:0 16px 2px}
main{padding-bottom:170px}
.tbar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:8;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -4px 16px rgba(35,32,94,.06)}
.tbar button{flex:1;border:0;background:none;padding:8px 2px 7px;font-size:11px;font-weight:700;color:var(--ink2);display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.tbar button i{font-style:normal;font-size:21px;line-height:1;filter:grayscale(1);opacity:.65}
.tbar button.on{color:var(--ind)}.tbar button.on i{filter:none;opacity:1}
.tbar .dot{position:absolute;top:2px;left:calc(50% + 6px);background:var(--amb);color:var(--ind);border-radius:9px;font-size:10px;min-width:17px;height:17px;line-height:17px;padding:0 4px;font-weight:800}
.bar{bottom:calc(58px + env(safe-area-inset-bottom));padding-bottom:10px}
.secs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.sec{border:0;border-radius:16px;background:#fff;box-shadow:0 1px 4px rgba(35,32,94,.08);padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:104px;color:var(--ink)}
.sec i{font-style:normal;font-size:28px;line-height:1}
.sec b{font-size:15px;color:var(--ind);line-height:1.25}
.sec small{color:var(--ink2);font-weight:600;font-size:12px}
.sec.dark{background:var(--ind);color:#fff}.sec.dark b{color:#fff}.sec.dark small{color:#c9c6f2}
.sh{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 10px}
.sh b{font-size:16px;color:var(--ind)}.sh button{border:0;background:none;color:var(--ind2);font-weight:700;font-size:13px}
.hrow{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none;margin:0 -12px 6px;padding-left:12px;padding-right:12px}
.hrow .bk{width:138px;flex:none}
.gal{display:flex;gap:8px;overflow-x:auto;margin:6px 0 14px;padding-bottom:4px}
.gal img,.gal video{height:210px;border-radius:10px;flex:none;background:#efeef6;cursor:zoom-in}
.gal .gdoc{height:210px;width:150px;flex:none;border:0;border-radius:10px;background:#ecebf6;color:var(--ind);font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.gal .gdoc i{font-style:normal;font-size:34px}
.pdfv canvas{width:100%;display:block;margin:0 0 8px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,.12);background:#fff}
.ibtn{border:0;border-radius:10px;background:#ecebf6;color:var(--ind);font-weight:700;padding:8px 12px;font-size:13px;margin-top:8px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.tl2{background:#fff;border-radius:14px;padding:12px;box-shadow:0 1px 4px rgba(35,32,94,.08);display:flex;flex-direction:column;gap:2px}
.tl2 b{font-size:22px;color:var(--ind);line-height:1.15}.tl2 span{font-weight:700;font-size:13px}.tl2 small{color:var(--ink2);font-size:12px}
.tl2.tg b{color:var(--ok)}.tl2.tr b{color:var(--bad)}.tl2.warn{background:#fff8e8}.tl2.dark{background:var(--ind);color:#fff}.tl2.dark b{color:var(--amb)}.tl2.dark small{color:#c9c6f2}
.chart{display:flex;gap:4px;height:120px;align-items:stretch}.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}
.chart .bars{flex:1;width:100%;display:flex;align-items:flex-end;gap:1px}.chart .bars i{flex:1;border-radius:3px 3px 0 0;min-height:2px}.chart small{font-size:10px;color:var(--ink2)}
.leg{display:flex;gap:14px;font-size:12px;color:var(--ink2);margin-bottom:8px}.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.trow{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}.trow:last-child{border-bottom:0}
.chk{display:flex;align-items:center;gap:8px;color:var(--ink);font-weight:600}.chk input{width:auto}
.seg button{font-size:12px;padding:8px 4px}
#splash{position:fixed;inset:0;z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:radial-gradient(circle at 50% 38%,#38348a 0,#23205E 45%,#15133d 100%);transition:opacity .45s ease,visibility .45s}
#splash.off{opacity:0;visibility:hidden}
#splash .glow{position:relative;width:140px;height:140px;display:flex;align-items:center;justify-content:center}
#splash .glow:before{content:"";position:absolute;inset:-30px;border-radius:50%;background:radial-gradient(circle,rgba(245,165,36,.33) 0,rgba(245,165,36,0) 68%);animation:spGlow 2.2s ease-in-out infinite}
#splash .mark{width:104px;height:auto;position:relative;overflow:visible;animation:spJump 1.6s cubic-bezier(.3,.7,.4,1) infinite;filter:drop-shadow(0 10px 18px rgba(0,0,0,.35))}
#splash .mark circle{animation:spSun 1.6s ease-in-out infinite;transform-origin:60px 26px}
#splash .word{height:46px;width:auto;opacity:0;transform:translateY(8px);animation:spIn .6s .25s ease forwards}
#splash .ring{width:40px;height:40px;border-radius:50%;border:3px solid rgba(255,255,255,.14);border-top-color:#F5A524;animation:spRot .9s linear infinite;margin-top:14px}
#splash .tx{color:rgba(255,255,255,.65);font-weight:700;font-size:15px}
#splash .tx i{display:inline-block;animation:spDot 1.2s infinite;font-style:normal}#splash .tx i:nth-child(2){animation-delay:.2s}#splash .tx i:nth-child(3){animation-delay:.4s}
@keyframes spJump{0%,100%{transform:translateY(0) scale(1)}35%{transform:translateY(-16px) scale(1.04) rotate(-3deg)}55%{transform:translateY(0) scale(1.06,.94)}70%{transform:translateY(-4px) scale(.98,1.02)}}
@keyframes spSun{0%,100%{transform:scale(1)}35%{transform:scale(1.25)}}
@keyframes spGlow{0%,100%{opacity:.6;transform:scale(.92)}50%{opacity:1;transform:scale(1.08)}}
@keyframes spRot{to{transform:rotate(360deg)}}
@keyframes spIn{to{opacity:1;transform:none}}
@keyframes spDot{0%,60%,100%{opacity:.2}30%{opacity:1}}
</style>
</head>

function api(p,b){b=b||{};b.initData=ID;return fetch('/app/api/'+p,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)}).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error||'Xatolik');return j;});});}
function img(b,cls){return b.photo?'<img loading="lazy" src="/app/img/'+b.id+'?v='+encodeURIComponent(b.photo)+'" alt="">':'<div class="ph"><i></i>'+esc(b.title)+'</div>';}
function qty(id){var c=(S.D.cart||[]).filter(function(x){return x.id===id;})[0];return c?c.qty:0;}
function cartSum(){var s=0,n=0;(S.D.cart||[]).forEach(function(c){n+=c.qty;if(c.price>0)s+=c.price*c.qty;});return {s:s,n:n};}
function stepper(id,q){return '<div class="step"><button data-q="'+id+':'+(q-1)+'">−</button><span>'+q+'</span><button data-q="'+id+':'+(q+1)+'">+</button></div>';}
function buyBtn(b){var q=qty(b.id);if(q&&b.pdf)return '<button class="add soft" data-q="'+b.id+':0">✓ Savatchada · olib tashlash</button>';if(q)return stepper(b.id,q);return '<button class="add'+(b.price>0?'':' soft')+'" data-q="'+b.id+':1">'+(b.price>0?'Savatchaga':'🔔 Narxi chiqqanda xabar')+'</button>';}

function nav(){var c=cartSum();var items=[['shop','🏠','Dökon'],['cart','🛒','Savatcha'],['orders','📦','Buyurtmalar'],['keys','✅','Javoblar']];if(S.D.admin)items.push(['admin','⚙️','Admin']);
  var act=S.view==='checkout'?'cart':S.view==='done'?'orders':(S.view==='test'||S.view==='kbook')?'keys':S.view;
  $('nav').innerHTML=items.map(function(x){return '<button data-nav="'+x[0]+'" class="'+(act===x[0]?'on':'')+'"><i>'+x[1]+'</i>'+x[2]+(x[0]==='cart'&&c.n?'<span class="dot">'+c.n+'</span>':'')+'</button>';}).join('');
  var showTabs=S.view==='shop'&&S.cat&&!S.qs.trim();
  $('tabs').innerHTML=showTabs?[{key:'',title:'🏠 Bölimlar'}].concat(S.D.cats,[{key:'__new',title:'🆕 Yangi kelganlar'}]).map(function(c){return '<button class="tab'+(S.cat===c.key?' on':'')+'" data-cat="'+esc(c.key)+'">'+esc(c.title)+'</button>';}).join(''):'';
  $('tabs').style.display=showTabs?'flex':'none';}

function bar(){var c=cartSum(),b=$('bar');
  if(S.view==='shop'&&c.n){b.hidden=false;b.innerHTML='<div class="in"><button class="big" data-nav="cart"><span>🛒 Savatcha · '+c.n+' dona</span><span>'+(c.s?money(c.s):'')+'</span></button></div>';return;}
  if(S.view==='cart'&&c.s){b.hidden=false;b.innerHTML='<div class="in"><button class="big ind" data-nav="checkout"><span>Buyurtma berish</span><span>'+money(c.s)+' →</span></button></div>';return;}
  if(S.view==='checkout'){b.hidden=false;b.innerHTML='<div class="in"><button class="big" id="send" '+(S.busy?'disabled':'')+'><span>'+(S.busy?'Yuborilmoqda…':'✅ Buyurtmani tasdiqlash')+'</span><span>'+money(c.s)+'</span></button></div>';return;}
  if(S.view==='test'&&S.T&&!S.T.checked){var na=S.T.ans.filter(Boolean).length;b.hidden=false;b.innerHTML='<div class="in"><button class="big ind" id="tcheck" '+(na?'':'disabled')+'><span>✅ Tekshirish</span><span>'+na+' / '+S.T.t.key.length+'</span></button></div>';return;}
  b.hidden=true;b.innerHTML='';}

function shopList(){var q=S.qs.trim().toLowerCase();
  if(q){var nq=NA(q);return S.D.books.filter(function(b){var t=b.title.toLowerCase();return t.indexOf(q)>=0||t.indexOf(nq)>=0||(b.desc||'').toLowerCase().indexOf(nq)>=0;});}
  if(S.cat==='__new')return S.D.books.slice().sort(function(a,b){return b.id-a.id;}).slice(0,8);
  return S.D.books.filter(function(b){return b.cat===S.cat;});}
function gridHtml(){var list=shopList();
  if(!list.length)return '<div class="empty">'+(S.qs.trim()?'🔎 «'+esc(S.qs.trim())+'» bo‘yicha kitob topilmadi.':'Bu bo‘limda hozircha kitob yo‘q.')+'</div>';
  return (S.qs.trim()?'<div class="note" style="margin:0 4px 10px">🔎 '+list.length+' ta kitob topildi</div>':'')+'<div class="grid">'+list.map(function(b){return '<div class="bk"><div class="cov" data-open="'+b.id+'">'+img(b)+(b.smp?'<span class="badge">📖 Namuna</span>':'')+(b.pdf?'<span class="badge pdf">📄 PDF</span>':'')+'</div><div class="bi"><div class="bt" data-open="'+b.id+'">'+esc(b.title)+'</div><div class="pr'+(b.price>0?'':' soon')+'">'+(b.price>0?money(b.price):'⏳ Narxi tez orada')+'</div><div class="sp"></div>'+buyBtn(b)+'</div></div>';}).join('')+'</div>';}
function homeHtml(){var ic=function(t){var m=String(t).match(/^(\p{Extended_Pictographic}️?)\s*(.*)$/u);return m?[m[1],m[2]]:['📚',t];};
  var h='<div class="secs">'+S.D.cats.map(function(c){var n=S.D.books.filter(function(b){return b.cat===c.key;}).length,x=ic(c.title);return '<button class="sec" data-cat="'+esc(c.key)+'"><i>'+x[0]+'</i><b>'+esc(x[1])+'</b><small>'+n+' ta kitob</small></button>';}).join('')+
  '<button class="sec dark" data-nav="keys"><i>✅</i><b>Testlar javoblari</b><small>Javobingizni tekşiring</small></button></div>';
  var nw=S.D.books.slice().sort(function(a,b){return b.id-a.id;}).slice(0,8);
  if(nw.length)h+='<div class="sh"><b>🆕 Yangi kelganlar</b><button data-cat="__new">Barçasi ›</button></div><div class="hrow">'+nw.map(bookCard).join('')+'</div>';
  return h;}
function bookCard(b){return '<div class="bk"><div class="cov" data-open="'+b.id+'">'+img(b)+(b.smp?'<span class="badge">📖 Namuna</span>':'')+(b.pdf?'<span class="badge pdf">📄 PDF</span>':'')+'</div><div class="bi"><div class="bt" data-open="'+b.id+'">'+esc(b.title)+'</div><div class="pr'+(b.price>0?'':' soon')+'">'+(b.price>0?money(b.price):'⏳ Narxi tez orada')+'</div><div class="sp"></div>'+buyBtn(b)+'</div></div>';}
function vShop(){return '<div class="srch"><span>🔎</span><input id="qs" type="search" placeholder="Kitob qidirish…" value="'+esc(S.qs)+'" autocomplete="off"></div><div id="grid">'+(S.qs.trim()||S.cat?gridHtml():homeHtml())+'</div>';}

function vCart(){var C=S.D.cart||[];
  if(!C.length)return '<div class="empty">🛒 Savatchangiz bo‘sh.<br><br><button class="add" style="width:auto;padding:10px 18px" data-nav="shop">Kitob tanlash</button></div>';
  var c=cartSum(),un=C.some(function(x){return !(x.price>0);});
  return '<div class="card"><h2>🛒 Savatcha</h2>'+C.map(function(x){var b=S.D.books.filter(function(y){return y.id===x.id;})[0]||{id:x.id,title:x.title};return '<div class="ci"><div class="th">'+(b.photo?'<img src="/app/img/'+b.id+'?v='+encodeURIComponent(b.photo)+'">':'')+'</div><div class="nm"><b>'+esc(x.title)+'</b><small>'+(x.price>0?x.qty+' × '+money(x.price):'⏳ narxi hali e’lon qilinmagan')+'</small></div>'+stepper(x.id,x.qty)+'</div>';}).join('')+
  '<div class="tot"><span>Jami</span><span>'+money(c.s)+'</span></div>'+
  (un?'<div class="note">⏳ Narxi e’lon qilinmagan kitoblar hozircha buyurtmaga kirmaydi — narxi chiqqanda xabar beramiz.</div>':'')+
  '<div class="note">📮 Pochta xizmati haqi narxga kirmaydi — uni kitobni olayotganda pochtada o‘zingiz to‘laysiz.</div></div>';}

function cartDigital(){var C=(S.D.cart||[]).filter(function(x){return x.price>0;});return C.length>0&&C.every(function(x){return bookOf(x.id).pdf;});}
function vCheckout(){var F=S.form,R=S.D.regions,DG=cartDigital();
  var regs=R.map(function(r){return '<option value="'+esc(r[0])+'"'+(F.region===r[0]?' selected':'')+'>'+esc(r[1])+'</option>';}).join('');
  var cur=R.filter(function(r){return r[0]===F.region;})[0];
  var dis=cur?cur[2].map(function(d){return '<option value="'+esc(d[0])+'"'+(F.district===d[0]?' selected':'')+'>'+esc(d[1])+'</option>';}).join(''):'';
  return '<div class="card"><h2>📝 Buyurtma ma’lumotlari</h2>'+
  '<label for="f_name">Ism va familiya</label><input id="f_name" data-f="name" value="'+esc(F.name)+'" placeholder="Masalan: Aliyev Vali" autocomplete="name">'+
  '<label for="f_phone">Telefon raqam</label><input id="f_phone" data-f="phone" value="'+esc(F.phone)+'" placeholder="+998 90 123 45 67" inputmode="tel" autocomplete="tel">'+
  (DG?'<div class="note" style="color:var(--ink);font-weight:600">📄 Savatchangizda faqat PDF kitoblar bor — manzil va pochta kerak emas. To‘lov tasdiqlangach kitob «📦 Buyurtmalar» bölimida ilovaning özida ochiladi.</div>':'<label>Manzil</label>'+(F.prev?'<div class="seg"><button data-am="prev" class="'+(F.am==='prev'?'on':'')+'">📌 Oldingi</button><button data-am="list" class="'+(F.am==='list'?'on':'')+'">Ro‘yxatdan</button><button data-am="manual" class="'+(F.am==='manual'?'on':'')+'">O‘zim yozaman</button></div>':'<div class="seg"><button data-am="list" class="'+(F.am==='list'?'on':'')+'">Ro‘yxatdan tanlash</button><button data-am="manual" class="'+(F.am==='manual'?'on':'')+'">O‘zim yozaman</button></div>')+
  (F.am==='prev'?'<div class="note" style="color:var(--ink);font-weight:600">'+esc(F.prevShow)+'</div>':'')+
  (F.am==='list'?'<label for="f_region">Viloyat</label><select id="f_region" data-f="region"><option value="">— tanlang —</option>'+regs+'</select>'+
    (cur?'<label for="f_district">Tuman / shahar</label><select id="f_district" data-f="district"><option value="">— tanlang —</option>'+dis+'<option value="__other"'+(F.district==='__other'?' selected':'')+'>✍️ Ro‘yxatda yo‘q</option></select>'+(F.district==='__other'?'<input style="margin-top:8px" data-f="districtText" value="'+esc(F.districtText)+'" placeholder="Tuman yoki shahar nomi">':''):'')+
    '<label for="f_street">Mahalla, ko‘cha, uy</label><input id="f_street" data-f="street" value="'+esc(F.street)+'" placeholder="Masalan: Navro‘z mahallasi, Bobur ko‘chasi 12">':'')+
  (F.am==='manual'?'<textarea data-f="address" placeholder="Viloyat, tuman, mahalla/ko‘cha, uy">'+esc(F.address)+'</textarea>':'')+
  '<label for="f_post">📮 Yaqin BTS yoki EMU pochta bo‘limi</label><textarea id="f_post" data-f="comment" placeholder="Masalan: BTS, Asaka sh., Navoiy ko‘chasi 25 (bozor yonida)">'+esc(F.comment)+'</textarea>'+
  '<div class="note">Kitoblar shu pochta bo‘limiga jo‘natiladi, siz u yerdan olasiz. Pochta xizmati haqini o‘zingiz to‘laysiz.</div>')+
  '<div class="err" id="err">'+esc(F.err||'')+'</div></div>'+
  '<div class="card"><h3>🧾 Buyurtmangiz</h3>'+S.D.cart.filter(function(x){return x.price>0;}).map(function(x){return '<div style="display:flex;justify-content:space-between;gap:8px;padding:4px 0"><span>'+esc(x.title)+' × '+x.qty+'</span><b style="white-space:nowrap">'+money(x.price*x.qty)+'</b></div>';}).join('')+'<div class="tot"><span>Jami</span><span>'+money(cartSum().s)+'</span></div></div>';}

function vOrders(){if(!S.orders)return '<div class="load">Yuklanmoqda…</div>';
  if(!S.orders.length)return '<div class="empty">📦 Hali buyurtmangiz yo‘q.</div>';
  return S.orders.map(function(o){return '<div class="card ord"><div class="hd"><span>Buyurtma #'+o.id+'</span><span>'+money(o.total)+'</span></div><div class="st">'+esc(o.status)+'</div><div class="note" style="margin:0">📅 '+esc(o.date)+(o.track?' · 📦 Trek: <b>'+esc(o.track)+'</b>':'')+'</div><ul>'+o.items.map(function(i){return '<li>'+esc(i.title)+' × '+i.qty+'</li>';}).join('')+'</ul>'+o.items.filter(function(i){return i.pdf;}).map(function(i){return '<button class="ibtn" data-mypdf="'+i.id+'" data-t="'+esc(i.title)+'">📖 «'+esc(i.title)+'» ni öqiş</button> ';}).join('')+(o.pay?'<div class="paybox" style="font-weight:500">'+(S.payInfo?esc(S.payInfo):'Karta ma’lumotini admin tez orada yuboradi.')+'</div><button class="btn2" style="width:100%" data-rcpt="'+o.id+'">🧾 Chekni yuklash</button>':'')+(o.st==='check'?'<div class="note">🧾 Chek yuborilgan — admin tekshirmoqda.</div>':'')+'</div>';}).join('')+(S.D.contact?'<div class="card"><h3>☎️ Aloqa</h3><div style="white-space:pre-wrap">'+esc(S.D.contact)+'</div></div>':'');}

function bookOf(id){return S.D.books.filter(function(x){return x.id===id;})[0]||{};}
function vKeys(){if(!S.keys)return '<div class="load">Yuklanmoqda…</div>';
  var R=S.res.slice(0,8),h=(R.length?'<div class="card"><h3>📊 Oxirgi natijalarim</h3>'+R.map(function(r){var p=Math.round(r.ok*100/r.n);return '<button class="tl" data-test="'+r.key+'"><span class="nn" style="width:auto;min-width:46px;padding:0 6px;background:'+(p>=80?'#e3f6ec':p>=50?'#fff4d6':'#fdeaea')+';color:'+(p>=80?'var(--ok)':p>=50?'#a15c00':'var(--bad)')+'">'+p+'%</span><span class="tt">'+esc(r.btitle)+'<small>'+esc(r.title)+' · '+r.ok+'/'+r.n+' · '+fdate(r.ts)+'</small></span></button>';}).join('')+'</div>':'')+(S.keys.length?'<div class="note" style="margin:0 4px 10px">Kitobingizni tanlang 👇</div>'+S.keys.map(function(b){var bk=bookOf(b.id),q=b.tests.reduce(function(a,t){return a+t.key.length;},0);return '<button class="kb" data-kb="'+b.id+'"><div class="th">'+(bk.photo?'<img loading="lazy" src="/app/img/'+b.id+'?v='+encodeURIComponent(bk.photo)+'">':'')+'</div><div class="tx"><b>'+esc(b.title)+'</b><small>'+b.tests.length+' ta test · '+q+' ta savol</small></div><span class="ar">›</span></button>';}).join(''):'<div class="empty">✅ Hali javoblar qo‘shilmagan.</div>');
  if(S.D.admin){var K=S.kf;h+='<div class="card"><h3>⚙️ Javob kaliti qo‘shish (admin)</h3><label for="k_book">Kitob</label><select id="k_book" data-k="book_id"><option value="">— tanlang —</option>'+S.D.books.map(function(b){return '<option value="'+b.id+'"'+(String(K.book_id)===String(b.id)?' selected':'')+'>'+esc(b.title)+'</option>';}).join('')+'</select>'+
    '<label for="k_text">Testlar va javoblar — har bir test alohida qatorda</label><textarea id="k_text" data-k="text" style="min-height:130px" placeholder="1-dars 1-test: 1A 2C 3B 4D 5A&#10;1-dars 2-test: ACBDA BCDAB">'+esc(K.text)+'</textarea>'+
    '<div class="note">Har qatorda: test nomi, ikki nuqta, keyin javoblar. «1A 2C 3B» yoki ketma-ket «ACBD» ko‘rinishida yozsa bo‘ladi.</div><div class="err" id="kerr">'+esc(K.err||'')+'</div><button class="add" id="kadd">➕ Qo‘shish</button></div>';}
  return h;}
function vKBook(){if(!S.keys)return '<div class="load">Yuklanmoqda…</div>';var b=S.keys.filter(function(x){return x.id===S.KB;})[0];if(!b)return '<div class="empty">Topilmadi</div>';
  return '<div class="card"><div class="note" style="margin:0">📘 Kitob</div><h2 style="margin:4px 0 0">'+esc(b.title)+'</h2><div class="note">Testni tanlang — javoblaringizni tekshiring yoki kalitni ko‘ring</div></div><div class="card" style="padding:4px 12px">'+
  b.tests.map(function(t){var m=t.title.match(/^(\d+)-dars:?\s*(.*)$/);return '<button class="tl" data-test="'+t.id+'"><span class="nn">'+(m?m[1]:'•')+'</span><span class="tt">'+(m?m[1]+'-dars':esc(t.title))+'<small>'+esc(m?m[2]:'')+(m&&m[2]?' · ':'')+t.key.length+' ta savol</small></span>'+pillRes(t.id)+'<span class="ar" style="color:var(--ink2);font-size:22px">›</span></button>';}).join('')+'</div>';}
function lastRes(id){var r=S.res.filter(function(x){return x.key===id;})[0];return r?Math.round(r.ok*100/r.n):null;}
function pillRes(id){var l=lastRes(id);return l==null?'':'<span class="pill '+(l>=80?'g':l>=50?'y':'r')+'">'+l+'%</span>';}
function fdate(ts){var d=new Date(ts);return d.getDate()+'.'+String(d.getMonth()+1).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function letters(t){return t.key.indexOf('E')>=0?['A','B','C','D','E']:['A','B','C','D'];}
function vTest(){var T=S.T,t=T.t,L=letters(t),ok=0;
  var rows=t.key.map(function(k,i){var a=T.ans[i]||'';if(T.checked&&a===k)ok++;
    return '<div class="q"><span class="n">'+(i+1)+'.</span><div class="opts">'+L.map(function(l){var c='';if(T.checked){if(l===k)c='good';else if(l===a)c='bad';}else if(l===a)c='on';return '<button class="'+c+'" data-a="'+i+':'+l+'"'+(T.checked?' disabled':'')+'>'+l+'</button>';}).join('')+'</div><span class="mk">'+(T.checked?(a===k?'✅':a?'❌':'➖'):'')+'</span></div>';}).join('');
  var top='<div class="card"><div class="note" style="margin:0">'+esc(T.book)+'</div><h2 style="margin:4px 0 0">'+esc(t.title)+'</h2><div class="note">'+t.key.length+' ta savol'+(function(){var p=S.res.filter(function(x){return x.key===t.id;});return p.length?' · avvalgi urinishlar: '+p.slice(0,5).map(function(x){return Math.round(x.ok*100/x.n)+'%';}).join(', '):'';})()+'</div></div>';
  var res='';if(T.checked){var pct=Math.round(ok*100/t.key.length);res='<div class="card res"><div class="big2">'+pct+'%</div><div>'+ok+' ta to‘g‘ri · '+(t.key.length-ok)+' ta xato yoki belgilanmagan</div><div class="row2"><button class="add soft" id="tagain">↺ Qayta ishlash</button><button class="add" data-nav="kbook">Boshqa test</button></div></div>';}
  var key=T.showKey?'<div class="card"><h3>🔑 Javoblar kaliti</h3><div class="kgrid">'+t.key.map(function(k,i){return '<span>'+(i+1)+'. <b>'+k+'</b></span>';}).join('')+'</div></div>':'';
  return top+res+(T.checked?'':'<div class="note" style="margin:0 4px 10px">Javoblaringizni belgilang va «Tekshirish» ni bosing.</div>')+'<div class="card">'+rows+'</div>'+key+
    '<div class="row2" style="margin-bottom:12px"><button class="add soft" id="tkey">'+(T.showKey?'🙈 Kalitni yashirish':'🔑 Kalitni ko‘rish')+'</button>'+(S.D.admin?'<button class="add soft" style="color:var(--bad)" id="tdel">🗑 O‘chirish</button>':'')+'</div>';}
function payCard(info,id,total){return '<div class="card"><h3>💳 To‘lov</h3><div class="kv">Summa: <b>'+money(total)+'</b></div>'+(info?'<div class="paybox">'+esc(info)+'</div>':'<div class="note">Karta ma’lumotini admin tez orada yuboradi.</div>')+'<div class="note" style="margin-bottom:10px">To‘lovni qilgach, to‘lov cheki skrinshotini (yoki PDF) yuklang — admin tekshirib tasdiqlaydi.</div><button class="big ind" style="width:100%;justify-content:center" data-rcpt="'+id+'">🧾 Chekni yuklash</button></div>';}
function vDone(){var d=S.done;if(d.rc==='check')return '<div class="card ok"><div class="ic">✅</div><h2>Chek qabul qilindi!</h2><p class="note">Admin tekshirib tasdiqlagach, '+(d.digital?'PDF kitobni «📦 Buyurtmalar» bölimida ilovaning özida öqiysiz.':'kitoblaringiz pochtaga topshiriladi.')+' Holatini «📦 Buyurtmalarim» bo‘limida kuzatasiz.</p><br><button class="big ind" style="width:100%;justify-content:center" data-nav="orders">📦 Buyurtmalarim</button></div>';
  return '<div class="card ok"><div class="ic">🎉</div><h2>Buyurtmangiz qabul qilindi!</h2><p>Buyurtma raqami: <b>#'+d.id+'</b><br>Jami: <b>'+money(d.total)+'</b></p></div>'+payCard(d.payInfo,d.id,d.total)+'<button class="add soft" style="margin-bottom:12px" id="close">Keyinroq — bot chatiga o‘tish</button>';}

function vAdmin(){var A=S.A;var h='<div class="seg" style="margin-bottom:12px">'+[['stats','📊 Statistika'],['bc','📢 Xabar'],['orders','🧾 Buyurtma'],['books','📚 Kitoblar']].map(function(x){return '<button data-atab="'+x[0]+'" class="'+(A.tab===x[0]?'on':'')+'">'+x[1]+'</button>';}).join('')+'</div>';
  if(A.tab==='stats')return h+vStats();
