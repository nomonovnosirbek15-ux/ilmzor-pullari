<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ilmzor — Vazifalar va ballar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
@font-face{font-family:Satoshi;src:url(fonts/Satoshi-Medium.woff2) format('woff2');font-weight:500;font-display:swap}
@font-face{font-family:Satoshi;src:url(fonts/Satoshi-Bold.woff2) format('woff2');font-weight:700;font-display:swap}
@font-face{font-family:Satoshi;src:url(fonts/Satoshi-Black.woff2) format('woff2');font-weight:900;font-display:swap}
:root{
  --bg:#f4f3ef; --surface:#fcfcfb; --card:#ffffff; --ink:#0b0b0b; --ink2:#52514e; --muted:#85847b;
  --line:#e4e2da; --grid:#ecebe5; --accent:#2a78d6; --accent-soft:#e3eefb;
  --good:#0ca30c; --warn:#fab219; --crit:#d03b3b; --shadow:0 1px 2px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#121211; --surface:#1a1a19; --card:#1f1f1e; --ink:#f0efec; --ink2:#c3c2b7; --muted:#8f8e85;
    --line:#33322f; --grid:#2a2a28; --accent:#3987e5; --accent-soft:#1d2d42; --shadow:none; }
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:16px;padding:14px 20px;background:var(--card);border-bottom:1px solid var(--line);flex-wrap:wrap;position:sticky;top:0;z-index:5}
.brand{font-weight:700;font-size:17px;letter-spacing:-.01em}
.brand small{display:block;font-weight:500;font-size:12px;color:var(--ink2)}
nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav a{padding:8px 14px;border-radius:8px;text-decoration:none;color:var(--ink2);font-weight:600}
nav a.on{background:var(--accent-soft);color:var(--accent)}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 20px}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:3px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:7px;cursor:pointer;color:var(--ink2);font-weight:600}
.seg button.on{background:var(--accent);color:#fff}
.btn{border:1px solid var(--line);background:var(--card);padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--ink2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--crit)}
.btn.sm{padding:4px 9px;font-size:13px}
.plabel{font-weight:700;font-size:15px;min-width:170px;text-align:center}
select.inp,input.inp,textarea.inp{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 10px;width:100%}
select.inp{width:auto}
main{padding:0 20px 40px;max-width:1240px;margin:0 auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.kpi .lab{color:var(--ink2);font-size:13px;font-weight:600}
.kpi .val{font-size:30px;font-weight:750;letter-spacing:-.02em;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.ring{display:flex;align-items:center;gap:14px}
h2{font-size:15px;margin:0 0 10px}
.cols{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-top:14px}
@media (max-width:860px){.cols{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;color:var(--ink2);font-weight:600;padding:8px 6px;border-bottom:1px solid var(--line)}
td{padding:9px 6px;border-bottom:1px solid var(--grid);vertical-align:middle;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer} tr.click:hover td{background:var(--accent-soft)}
.pbar{height:8px;background:var(--grid);border-radius:4px;overflow:hidden;min-width:70px}
.pbar i{display:block;height:100%;border-radius:0 4px 4px 0}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--ink2);white-space:nowrap}
.badge b{width:9px;height:9px;border-radius:50%;display:inline-block}
.muted{color:var(--muted)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.grid2{display:grid;grid-template-columns:380px 1fr;gap:14px;align-items:start}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
label.f{display:block;font-size:12.5px;font-weight:600;color:var(--ink2);margin:10px 0 4px}
.row{display:flex;gap:8px}
.row>*{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:4px 10px;font-size:12.5px;cursor:pointer;font-weight:600}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.stlist{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--surface)}
.stlist .gh{font-size:11.5px;font-weight:700;color:var(--muted);margin:6px 0 2px;text-transform:uppercase;letter-spacing:.04em}
.stlist label{display:flex;gap:8px;align-items:center;padding:3px 0;cursor:pointer}
.task{display:grid;grid-template-columns:1fr auto;gap:8px;padding:12px 0;border-bottom:1px solid var(--grid)}
.task:last-child{border-bottom:0}
.task .t{font-weight:650}
.task .m{font-size:12.5px;color:var(--ink2)}
.tag{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-weight:600;margin-left:6px}
.back{margin-bottom:12px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-start;justify-content:center;padding:30px 12px;z-index:20;overflow:auto}
#modal.open{display:flex}
.mbox{background:var(--card);border-radius:14px;max-width:640px;width:100%;padding:18px;border:1px solid var(--line)}
.gtab input{width:70px;padding:5px 7px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:9px;font-weight:600;display:none;z-index:30;max-width:90vw}
#tip{position:fixed;pointer-events:none;background:var(--card);border:1px solid var(--line);box-shadow:0 4px 14px rgba(0,0,0,.12);border-radius:8px;padding:7px 10px;font-size:12.5px;display:none;z-index:25}
#tip b{font-size:14px}
.notice{background:var(--accent-soft);border-radius:10px;padding:10px 14px;margin:0 0 12px;color:var(--ink)}
.typebar{margin:9px 0}
.typebar .h{display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px}
svg text{fill:var(--ink2);font-size:11px}
.nbadge{display:inline-block;min-width:18px;padding:0 6px;border-radius:9px;background:#c2620a;color:#fff;font-size:11.5px;line-height:18px;text-align:center;margin-left:4px}
.pill{display:inline-block;padding:2px 9px;border-radius:10px;color:#fff;font-size:12px;font-weight:700}
.warnbox{border-color:#f1b77a;background:linear-gradient(0deg,var(--card),var(--card)) padding-box;margin-bottom:14px;border-left:4px solid #e07b17}
.mini{font-size:11.5px;font-weight:600;white-space:nowrap}
.absrow td{opacity:.6}
.absrow td:last-child,.absrow td:nth-child(4){opacity:1}
.btn.on-abs{background:var(--ink2);color:var(--card);border-color:var(--ink2)}
.btn:disabled{opacity:.45;cursor:default}
.attbox{border-left:4px solid #d03b3b;margin-bottom:14px}
.attlist{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.attitem{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;cursor:pointer;display:grid;grid-template-columns:auto auto;gap:4px 8px;align-items:center;text-align:left;max-width:320px}
.attitem:hover{border-color:#d03b3b}
.attitem div{grid-column:1/-1}
.owebox{border-left:4px solid #7a4bc2;margin-bottom:14px}
.btn.on-owe{background:#7a4bc2;color:#fff;border-color:#7a4bc2}
.mfoot{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;position:sticky;bottom:-18px;background:var(--card);padding:10px 0 4px;border-top:1px solid var(--line)}
@media (max-width:640px){
  #modal{padding:0}
  .mbox{border-radius:0;min-height:100%;padding:14px}
  .gtab input{width:58px;font-size:16px;padding:8px 6px}
  .gtab .btn.sm{padding:8px 9px;font-size:13.5px}
  .gtab thead{display:none}
  .gtab tr{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid var(--grid)}
  .gtab td{padding:0;border:0}
  .gtab td:first-child{flex:1 0 100%}
  .gtab td:nth-child(2) input::placeholder{content:'ball'}
  .gtab td:last-child{margin-left:auto}
  .gtab td:nth-child(4){display:flex;flex-wrap:wrap;gap:4px;order:5;flex:1 0 100%}
  .hidem{display:none}
  header{padding:10px 12px} main{padding:0 10px 30px} .bar{padding:10px}
  .kpi .val{font-size:24px}
}
.cardgrid{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start}
.cardprev{width:100%;border-radius:10px;box-shadow:0 2px 12px rgba(0,0,0,.18);background:#eee}
@media (max-width:640px){.cardgrid{grid-template-columns:1fr}.cardprev{max-width:320px;margin:0 auto;display:block}}
.odbox{border-left:4px solid #d03b3b;margin-bottom:14px}
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
@media (max-width:700px){.strip{grid-template-columns:repeat(2,1fr)}}
.sitem{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
.sl{font-size:12.5px;font-weight:600;color:var(--ink2)}
.sv{font-size:32px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15;margin-top:2px}
.ss{font-size:12px;color:var(--ink2);margin-top:2px}
.ss a,.gname a{color:inherit}
.planlist{display:flex;flex-direction:column;gap:6px}
.planitem{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer}
.gridwrap{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:10px}
.ggrid{border-collapse:separate;border-spacing:0;width:auto;min-width:100%}
.ggrid th,.ggrid td{border-bottom:1px solid var(--grid);padding:4px;text-align:center}
.ggrid thead th{position:sticky;top:0;background:var(--card);z-index:2;vertical-align:bottom}
.ggrid .gname{position:sticky;left:0;background:var(--card);z-index:1;text-align:left;white-space:nowrap;padding:6px 10px;font-weight:600;min-width:170px}
.ggrid thead .gname{z-index:3}
.gcol{min-width:92px;max-width:120px;position:relative}
.gdate{font-size:11px;color:var(--ink2);font-weight:600}.gdate.gtoday{color:var(--accent)}
.gtitle{font-size:11.5px;font-weight:700;color:var(--ink);line-height:1.2;max-height:42px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;margin:2px 0}
.gdl{font-size:10px;color:var(--muted)}
.glink{position:absolute;top:2px;right:2px;border:0;background:none;cursor:pointer;color:var(--muted);font-size:14px;padding:0 4px}
.gin{width:58px;height:34px;text-align:center;border:1px solid var(--line);border-radius:8px;font-weight:700;font-size:15px}
.gin:focus{outline:2px solid var(--accent);outline-offset:1px}
.gna{color:var(--muted)}
.gfoot td{border-top:2px solid var(--line)}
@media (max-width:640px){.ggrid .gname{min-width:110px;max-width:120px;overflow:hidden;text-overflow:ellipsis;font-size:13px;padding:6px}.gcol{min-width:78px}.gin{width:52px}}
details.more{margin-top:14px}
details.more>summary{cursor:pointer;font-weight:700;padding:12px 16px;background:var(--card);border:1px solid var(--line);border-radius:12px;list-style:none;margin-bottom:14px}
details.more>summary::-webkit-details-marker{display:none}
.bulk{font-size:13px}
.pcell{display:inline-block;white-space:nowrap;min-width:46px;text-align:center;padding:2px 8px;border-radius:12px;font-weight:700;font-size:12.5px}
.gtab input{border-width:2px;width:64px}
.legend{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink2);margin:4px 0 10px}
.legend .grad{height:8px;width:160px;border-radius:4px;background:linear-gradient(90deg,hsl(2,80%,50%),hsl(46,80%,50%),hsl(122,80%,36%))}
.itm{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:8px;background:var(--surface)}
</style>

<body>
<header>
  <img src="brand/logo-belgi.png" alt="" style="height:36px;width:auto">
  <div class="brand">Ilmzor · Vazifalar va ballar<small>Kim qanday vazifa oldi, necha foiz bajardi</small></div>
  <nav id="nav">
    <a href="#bugun" data-v="bugun">📅 Bugun</a>
    <a href="#panel" data-v="panel">📊 Hisobot</a>
    <a href="#vazifalar" data-v="vazifalar">📝 Vazifalar</a>
    <a href="#oquvchilar" data-v="oquvchilar">👥 O‘quvchilar</a>
  </nav>
</header>
<div class="bar" id="fbar"></div>
<main id="view"><div class="empty">Yuklanmoqda…</div></main>
<div id="modal"></div>
<div id="toast"></div>
<div id="tip"></div>

<script>
const MONTHS=['yanvar','fevral','mart','aprel','may','iyun','iyul','avgust','sentabr','oktabr','noyabr','dekabr'];
const MONTHS_CAP=MONTHS.map(m=>m[0].toUpperCase()+m.slice(1));
const DAYS=['Yakshanba','Dushanba','Seshanba','Chorshanba','Payshanba','Juma','Shanba'];
const DSHORT=['Ya','Du','Se','Ch','Pa','Ju','Sh'];
const TYPES=['Uy vazifasi','Sinf ishi','Qo‘shimcha vazifa','Test','Saralash testi','Nazorat ishi','Lug‘at yodlash','Oylik test'];
const SAL='Saralash testi';
const OYL='Oylik test'; // oylik test — vazifa foiziga qo‘shilmaydi, alohida ko‘rsatiladi

const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(y,(m||1)-1,d||1);};
const today=()=>ymd(new Date());
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtP=p=>p==null?'—':(Math.round(p))+'%';
const fmtN=n=>Number.isInteger(n)?String(n):String(Math.round(n*10)/10);
const shortDate=s=>{const d=parse(s);return `${d.getDate()}-${MONTHS[d.getMonth()].slice(0,3)}, ${DSHORT[d.getDay()]}`;};

const S={db:null,user:null,canDelete:true,students:[],tasks:[],stuById:{},loaded:{s:false,t:false},err:null,slow:false,names:{},
  view:'bugun',gmode:'3',plan:null,moreOpen:false,period:'week',anchor:today(),group:'all',studentId:null,
  form:{mode:'common',items:[{title:'',type:TYPES[0],max:10,manual:false}],each:{},date:today(),note:'',sel:new Set()},
  sform:{name:'',group:'',bulk:''},editStu:null,confirm:null,modal:null,showArchived:false};

const isActive=x=>x&&!x.archived;
// A task is checked within DEADLINE_DAYS after it is given; after that an ungraded one counts as 0 ("bajarmadi").
const DEADLINE_DAYS=2;
function deadlineOf(date){const d=parse(date);d.setDate(d.getDate()+DEADLINE_DAYS);return ymd(d);}
const isOverdue=date=>!!date&&deadlineOf(date)<today();
const activeStudents=()=>S.students.filter(isActive);

/* ---------- colours ---------- */
function pcolor(p){
  if(p==null) return 'var(--muted)';
  p=Math.max(0,Math.min(100,p));
  let h,l;
  if(p<50){h=2+44*(p/50);l=50;} else {h=46+76*((p-50)/50);l=50-14*((p-50)/50);}
  return `hsl(${h.toFixed(0)},80%,${l.toFixed(0)}%)`;
}
function status(p){
  if(p==null) return {c:'var(--muted)',l:'Baholanmagan',i:'○'};
  const c=pcolor(p);
  if(p>=100) return {c,l:'Bajardi',i:'✓'};
  if(p>=80) return {c,l:'A‘lo',i:'▲'};
  if(p>=50) return {c,l:'O‘rta',i:'■'};
  if(p>0) return {c,l:'Past',i:'▼'};
  return {c,l:'Bajarmadi',i:'✗'};
}
function badge(p){const s=status(p);return `<span class="badge"><b style="background:${s.c}"></b>${s.i} ${s.l}</span>`;}
function pbar(p){const s=status(p);return `<div class="pbar"><i style="width:${p==null?0:Math.max(2,p)}%;background:${s.c}"></i></div>`;}

/* ---------- type guess & title numbering ---------- */
function guessType(title){
  const t=String(title||'').toLowerCase().replace(/[‘’ʻʼ`']/g,"'");
  if(/oylik/.test(t)) return 'Oylik test';
  if(/saralash/.test(t)) return 'Saralash testi';
  if(/nazorat/.test(t)) return 'Nazorat ishi';
  if(/sinf\s*ishi|sinfda/.test(t)) return 'Sinf ishi';
  if(/uy\s*ishi|uyga|uy\s*vazifa/.test(t)) return 'Uy vazifasi';
  if(/lug'?at|so'?z\s*yodla/.test(t)) return 'Lug‘at yodlash';
  if(/\blist|worksheet/.test(t)) return 'Uy vazifasi';
  if(/test|saralash/.test(t)) return 'Test';
  if(/qo'?shimcha/.test(t)) return 'Qo‘shimcha vazifa';
  return null;
}
// Finds the "counter" number in a title: 6-mavzu / 11-dars, "test - 4", "1-katta test"
function titleCounter(title){
  const s=String(title||'');
  let m,last=null;const re=/(\d+)(\s*-\s*)(mavzu|dars)/gi;
  while((m=re.exec(s))) last={i:m.index,len:m[1].length,n:+m[1]};
  if(!last){const r=/[-–]\s*(\d+)(?!.*\d)/.exec(s);if(r) last={i:r.index+r[0].length-r[1].length,len:r[1].length,n:+r[1]};}
  if(!last){const r=/^(\d+)-/.exec(s);if(r) last={i:0,len:r[1].length,n:+r[1]};}
  if(!last) return {key:s.trim().toLowerCase(),n:null,build:()=>s};
  const pre=s.slice(0,last.i),post=s.slice(last.i+last.len);
  return {key:(pre+'#'+post).trim().toLowerCase(),n:last.n,build:k=>pre+k+post};
}
function familyMax(){const mx={};for(const tk of S.tasks){const c=titleCounter(tk.title);if(c.n!=null)mx[c.key]=Math.max(mx[c.key]||0,c.n);}return mx;}
function nextTitles(titles){
  // returns next titles; numbered ones continue after the biggest number ever used in that family
  const mx=familyMax();
  return titles.map(t=>{const c=titleCounter(t);if(c.n==null) return t;mx[c.key]=(mx[c.key]||c.n)+1;return c.build(mx[c.key]);});
}

/* ---------- period ---------- */
function range(anchor=S.anchor,period=S.period){
  const a=parse(anchor);
  if(period==='day') return [a,new Date(a)];
  if(period==='week'){const dow=(a.getDay()+6)%7;const s=new Date(a);s.setDate(a.getDate()-dow);const e=new Date(s);e.setDate(s.getDate()+6);return [s,e];}
  return [new Date(a.getFullYear(),a.getMonth(),1),new Date(a.getFullYear(),a.getMonth()+1,0)];
}
function shifted(dir,anchor=S.anchor,period=S.period){
  const a=parse(anchor);
  if(period==='day') a.setDate(a.getDate()+dir);
  else if(period==='week') a.setDate(a.getDate()+7*dir);
  else {a.setDate(1);a.setMonth(a.getMonth()+dir);}
  return ymd(a);
}
function plabel(){
  const [s,e]=range();
  if(S.period==='day') return `${s.getDate()}-${MONTHS[s.getMonth()]}, ${DAYS[s.getDay()]}`;
  if(S.period==='week'){
    if(s.getMonth()===e.getMonth()) return `${s.getDate()}–${e.getDate()}-${MONTHS[e.getMonth()]}`;
    return `${s.getDate()}-${MONTHS[s.getMonth()]} – ${e.getDate()}-${MONTHS[e.getMonth()]}`;
  }
  return `${MONTHS_CAP[s.getMonth()]} ${s.getFullYear()}`;
}
function daysIn(s,e){const out=[];const d=new Date(s);while(d<=e){out.push(ymd(d));d.setDate(d.getDate()+1);}return out;}

/* ---------- data ---------- */
function groups(){return [...new Set(S.students.filter(isActive).map(s=>s.group||'Guruhsiz'))].sort((a,b)=>a.localeCompare(b));}
const inGroup=(st,group=S.group)=>group==='all'||(st.group||'Guruhsiz')===group;
function rowsIn(from,to,{group=S.group,sid=null,oyl=false}={}){
  const f=ymd(from),t=ymd(to),out=[];
  for(const tk of S.tasks){
    if(!tk.date||tk.date<f||tk.date>t) continue;
    if((tk.type===OYL)!==!!oyl) continue;
    const max=Number(tk.max)||0,sc=tk.scores||{},ab=tk.absent||{},ow=tk.owed||{};
    for(const id of (tk.studentIds||[])){
      const st=S.stuById[id]; if(!st) continue;
      if(!inGroup(st,group)) continue;
      if(sid&&id!==sid) continue;
      const absent=!!ab[id];
      const v=sc[id]; const ball=(absent||v===undefined||v===null||v==='')?null:Number(v);
      const owed=!absent&&ball==null&&!!ow[id];
      const overdue=!absent&&!owed&&ball==null&&isOverdue(tk.date);
      const b=overdue?0:ball;
      out.push({tk,id,st,max,ball:b,absent,owed,overdue,pct:(b==null||!max)?null:Math.max(0,Math.min(100,b/max*100))});
    }
  }
  return out;
}
function stats(rows){
  let b=0,m=0,ch=0,zero=0,abs=0,pend=0,owed=0,od=0;const tasks=new Set();
  for(const r of rows){tasks.add(r.tk.id);
    if(r.absent){abs++;continue;}
    if(r.owed){owed++;continue;}
    if(r.overdue){od++;m+=r.max;continue;}
    if(r.ball!=null){ch++;b+=r.ball;m+=r.max;if(r.ball===0)zero++;}
    else if(isActive(r.st)) pend++;}
  return {total:rows.length,tasks:tasks.size,checked:ch,pending:pend,absent:abs,owed,overdue:od,zero,ball:b,max:m,pct:m?Math.min(100,b/m*100):null};
}
// tasks (up to today) that still have active students without a score and not marked absent
function pendingTasks(group=S.group){
  const t=today(),out=[];
  for(const tk of S.tasks){
    if(!tk.date||tk.date>t) continue;
    const sc=tk.scores||{},ab=tk.absent||{},ow=tk.owed||{};
    const ids=(tk.studentIds||[]).filter(id=>{const st=S.stuById[id];return isActive(st)&&inGroup(st,group)&&!ab[id]&&!ow[id]&&(sc[id]===undefined||sc[id]===null||sc[id]==='');});
    if(ids.length) out.push({tk,ids,old:tk.date<t,od:isOverdue(tk.date)});
  }
  return out.sort((a,b)=>a.tk.date.localeCompare(b.tk.date));
}

function owedList(sid){
  const out=[];
  for(const tk of S.tasks){const ow=tk.owed||{},sc=tk.scores||{};
    if(ow[sid]&&(tk.studentIds||[]).includes(sid)&&(sc[sid]===undefined||sc[sid]===null||sc[sid]==='')&&!(tk.absent||{})[sid]) out.push(tk);}
  return out.sort((a,b)=>a.date.localeCompare(b.date));
}
// C. students who need attention, from their most recent graded work (all time, up to today)
function attention(group=S.group){
  const t=today(),by={};
  for(const tk of S.tasks){ if(!tk.date||tk.date>t||tk.type===OYL) continue; const max=Number(tk.max)||0; if(!max) continue;
    const sc=tk.scores||{},ab=tk.absent||{};
    const ow=tk.owed||{};
    for(const id of (tk.studentIds||[])){ if(ab[id]) continue; const v=sc[id]; let p;
      if(v===undefined||v===null||v===''){ if(ow[id]||!isOverdue(tk.date)) continue; p=0; } else p=Math.max(0,Math.min(100,Number(v)/max*100));
      (by[id]=by[id]||[]).push({date:tk.date,c:tk.created||0,p,sal:tk.type===SAL}); } }
  const out=[];
  for(const x of S.students){ if(!isActive(x)||!inGroup(x,group)) continue;
    const rs=(by[x.id]||[]).sort((a,b)=>b.date.localeCompare(a.date)||b.c-a.c);
    if(rs.length<3) continue;
    const reasons=[];
    const last3=rs.slice(0,3);if(last3.every(r=>r.p<50)) reasons.push('oxirgi 3 ta vazifa 50% dan past');
    const z=rs.slice(0,5).filter(r=>r.p===0).length;if(z>=2) reasons.push(`oxirgi 5 tadan ${z} tasi 0`);
    const sal=rs.filter(r=>r.sal).slice(0,3);if(sal.length>=2){const a=sal.reduce((s,r)=>s+r.p,0)/sal.length;if(a<50) reasons.push(`saralashda ${Math.round(a)}%`);}
    const avg=rs.slice(0,8).reduce((s,r)=>s+r.p,0)/Math.min(8,rs.length);
    if(reasons.length) out.push({x,reasons,avg});
  }
  return out.sort((a,b)=>b.reasons.length-a.reasons.length||a.avg-b.avg);
}

function barChart(points){
  const W=720,H=230,pl=38,pr=10,pt=14,pb=30,iw=W-pl-pr,ih=H-pt-pb,n=points.length||1;
  const slot=iw/n,bw=Math.max(6,Math.min(34,slot*0.62));
  let g='';
  for(const v of [0,25,50,75,100]){const y=pt+ih-ih*v/100;g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="var(--grid)" stroke-width="1"/><text x="${pl-6}" y="${y+4}" text-anchor="end">${v}%</text>`;}
  const every=n>16?Math.ceil(n/10):1;
  let bars='',hits='',best=-1,bi=-1;
  points.forEach((p,i)=>{if(p.value!=null&&p.value>best){best=p.value;bi=i;}});
  points.forEach((p,i)=>{
    const cx=pl+slot*i+slot/2;
    if(p.value!=null){
      const h=Math.max(3,ih*p.value/100),x=cx-bw/2,y=pt+ih-h,r=Math.min(4,bw/2,h);
      bars+=`<path d="M${x},${pt+ih} V${y+r} Q${x},${y} ${x+r},${y} H${x+bw-r} Q${x+bw},${y} ${x+bw},${y+r} V${pt+ih} Z" fill="${pcolor(p.value)}"/>`;
      if(i===bi&&n<=31) bars+=`<text x="${cx}" y="${y-5}" text-anchor="middle" style="font-weight:700;fill:var(--ink)">${fmtP(p.value)}</text>`;
    }
    if(i%every===0||n<=16) bars+=`<text x="${cx}" y="${H-10}" text-anchor="middle">${esc(p.label)}</text>`;
    const t=`<b>${p.value==null?'—':fmtP(p.value)}</b><br>${esc(p.tipTitle)}<br><span class='muted'>${p.n?p.n+' ta topshiriq baholangan':'Baholangan topshiriq yo‘q'}</span>`;
    hits+=`<rect x="${pl+slot*i}" y="${pt}" width="${slot}" height="${ih}" fill="transparent" data-tip="${esc(t)}"/>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Bajarish foizi grafigi">${g}<line x1="${pl}" x2="${W-pr}" y1="${pt+ih}" y2="${pt+ih}" stroke="var(--line)"/>${bars}${hits}</svg>`;
}
function trendPoints(rows,s,e){
  if(S.period==='day'){
    const by={};for(const r of rows){(by[r.tk.id]=by[r.tk.id]||[]).push(r);}
    return Object.values(by).map(rs=>{const st=stats(rs);const tk=rs[0].tk;return {label:tk.title.length>12?tk.title.slice(0,11)+'…':tk.title,tipTitle:tk.title+' · '+(tk.type||''),value:st.pct,n:st.checked};});
  }
  const by={};for(const r of rows){(by[r.tk.date]=by[r.tk.date]||[]).push(r);}
  return daysIn(s,e).map(d=>{const dt=parse(d);const st=stats(by[d]||[]);
    return {label:S.period==='week'?DSHORT[dt.getDay()]+' '+dt.getDate():String(dt.getDate()),tipTitle:`${dt.getDate()}-${MONTHS[dt.getMonth()]}, ${DAYS[dt.getDay()]}`,value:st.pct,n:st.checked};});
}
function typeBreakdown(rows){
  const by={};for(const r of rows){const k=r.tk.type||'Boshqa';(by[k]=by[k]||[]).push(r);}
  const items=Object.entries(by).map(([k,rs])=>({k,st:stats(rs)})).sort((a,b)=>(b.st.pct??-1)-(a.st.pct??-1));

}

function quickChips(){

  const from=new Date();from.setDate(from.getDate()-30);const f=ymd(from);
  const fam={};
  for(const tk of S.tasks){ if(tk.date<f) continue; if((tk.studentIds||[]).length<2) continue;
    const c=titleCounter(tk.title);const k=c.key;
    if(!fam[k]) fam[k]={n:0,last:tk};fam[k].n++; if(tk.date>fam[k].last.date||(tk.date===fam[k].last.date&&(tk.created||0)>(fam[k].last.created||0))) fam[k].last=tk; }
  const list=Object.values(fam).sort((a,b)=>b.n-a.n||b.last.date.localeCompare(a.last.date)).slice(0,8);
  if(!list.length) return '';
  const titles=nextTitles(list.map(x=>x.last.title));
  S._chips=list.map((x,i)=>({title:titles[i],type:x.last.type||guessType(titles[i])||TYPES[0],max:x.last.max??10}));
  return `<label class="f">Tez qo‘shish <span class="muted">(oxirgi vazifalaringiz, raqami o‘zi oshadi)</span></label><div class="chips">${S._chips.map((c,i)=>`<button class="chip" data-act="chipAdd" data-i="${i}" title="${esc(c.type)} · ${fmtN(Number(c.max))} ball">+ ${esc(c.title)}</button>`).join('')}</div>`;
}

/* ================= D. weekly dynamics ================= */
function weekRanges(n,endDate){
  // n weeks ending with the week that contains endDate (Mon..Sun)
  const e=parse(ymd(endDate));const dow=(e.getDay()+6)%7;const mon=new Date(e);mon.setDate(e.getDate()-dow);
  const out=[];for(let k=n-1;k>=0;k--){const s=new Date(mon);s.setDate(mon.getDate()-7*k);const f=new Date(s);f.setDate(s.getDate()+6);out.push([s,f]);}
  return out;
}
function weekLabel(s,f){return s.getMonth()===f.getMonth()?`${s.getDate()}–${f.getDate()} ${MONTHS[f.getMonth()].slice(0,3)}`:`${s.getDate()} ${MONTHS[s.getMonth()].slice(0,3)}–${f.getDate()} ${MONTHS[f.getMonth()].slice(0,3)}`;}
function weekSeries(sid,n=6){
  const end=range()[1];const t=parse(today());const e=end>t?t:end;
  return weekRanges(n,e).map(([s,f])=>{const st=stats(rowsIn(s,f,{group:'all',sid}));return {s,f,pct:st.pct,n:st.checked};});
}
function spark(series){
  const W=96,H=26,p=4,n=series.length;const pts=series.map((x,i)=>({x:p+i*(W-2*p)/Math.max(1,n-1),y:x.pct==null?null:H-p-(H-2*p)*x.pct/100,v:x}));
  const seg=[];let cur=[];pts.forEach(q=>{if(q.y==null){if(cur.length)seg.push(cur);cur=[];}else cur.push(q);});if(cur.length)seg.push(cur);
  const lines=seg.map(sg=>`<polyline points="${sg.map(q=>q.x.toFixed(1)+','+q.y.toFixed(1)).join(' ')}" fill="none" stroke="var(--ink2)" stroke-width="1.5" stroke-linejoin="round"/>`).join('');
  const dots=pts.filter(q=>q.y!=null).map(q=>`<circle cx="${q.x.toFixed(1)}" cy="${q.y.toFixed(1)}" r="3" fill="${pcolor(q.v.pct)}" stroke="var(--card)" stroke-width="1"/>`).join('');
  const vals=series.filter(x=>x.pct!=null);
  let delta='';if(vals.length>=2){const d=Math.round(vals[vals.length-1].pct-vals[vals.length-2].pct);delta=`<span class="mini" style="color:${d>0?'var(--good)':d<0?'var(--crit)':'var(--muted)'}">${d>0?'▲+':d<0?'▼':'•'}${d}</span>`;}
  const tipTxt=series.map(x=>`${weekLabel(x.s,x.f)}: <b>${x.pct==null?'—':fmtP(x.pct)}</b>`).join('<br>');
  return `<span style="display:inline-flex;align-items:center;gap:4px" data-tip="${esc(tipTxt)}"><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-label="Haftalik dinamika">${lines}${dots}</svg>${delta}</span>`;
}

function bestOf(){
  const [s,e]=range();const rows=rowsIn(s,e);const [ps,pe]=range(shifted(-1));const prow=rowsIn(ps,pe);
  const studs=activeStudents().filter(x=>inGroup(x));
  const L=studs.map(x=>{const r=rows.filter(q=>q.id===x.id);const st=stats(r);const need=st.total-st.absent;
    const sal=stats(r.filter(q=>q.tk.type===SAL));const pv=stats(prow.filter(q=>q.id===x.id));
    return {x,st,need,sal,grow:(st.pct!=null&&pv.pct!=null)?st.pct-pv.pct:null};});
  const elig=L.filter(a=>a.st.pct!=null&&a.st.checked>=2&&a.st.checked>=0.6*a.need);
  const top=[...elig].sort((a,b)=>b.st.pct-a.st.pct||b.st.checked-a.st.checked).slice(0,3);
  const grow=[...elig].filter(a=>a.grow!=null&&a.grow>=5).sort((a,b)=>b.grow-a.grow)[0]||null;
  const salTop=[...L].filter(a=>a.sal.pct!=null&&a.sal.checked>=2).sort((a,b)=>b.sal.pct-a.sal.pct)[0]||null;
  return {top,grow,salTop,count:elig.length};
}

/* ================= BUGUN: plan, grid, autosave ================= */
function addDays(s,n){const d=parse(s);d.setDate(d.getDate()+n);return ymd(d);}
// "Kechagidek berish": last day (before today) with group tasks, titles numbered on, same students
function repeatPlan(){
  const t=today();
  const cands=S.tasks.filter(x=>x.date<t&&x.type!==OYL&&(x.studentIds||[]).length>1&&(x.studentIds||[]).some(id=>isActive(S.stuById[id])&&inGroup(S.stuById[id])));
  if(!cands.length) return null;
  const last=cands.reduce((m,x)=>x.date>m?x.date:m,'');
  const set=cands.filter(x=>x.date===last).sort((a,b)=>(a.created||0)-(b.created||0));
  const titles=nextTitles(set.map(x=>x.title));
  return {from:last,items:set.map((x,i)=>({title:titles[i],type:x.type||guessType(titles[i])||TYPES[0],max:x.max??10,ids:(x.studentIds||[]).filter(id=>isActive(S.stuById[id]))}))};
}
function gridColumns(){
  const t=today();const back=S.gmode==='today'?0:S.gmode==='3'?3:6;const from=addDays(t,-back);
  const inG=tk=>S.group==='all'||(tk.studentIds||[]).some(id=>S.stuById[id]&&inGroup(S.stuById[id]));
  const pend=new Set(pendingTasks().map(p=>p.tk.id));
  let cols=S.tasks.filter(tk=>tk.date&&tk.date<=t&&inG(tk)&&(tk.date>=from||pend.has(tk.id)));
  cols.sort((a,b)=>a.date.localeCompare(b.date)||(a.created||0)-(b.created||0));
  if(cols.length>16) cols=cols.slice(-16);
  return cols;
}
function cellState(tk,id){
  const sc=tk.scores||{},ab=tk.absent||{},ow=tk.owed||{};const max=Number(tk.max)||0;
  if(ab[id]) return {k:'abs',txt:'K'};
  const v=sc[id];
  if(v!==undefined&&v!==null&&v!==''){const p=max?Math.max(0,Math.min(100,Number(v)/max*100)):0;return {k:'score',p,txt:String(Math.round(p)),ball:Number(v)};}
  if(ow[id]) return {k:'owe',txt:'Q'};
  if(isOverdue(tk.date)) return {k:'od',txt:''};
  return {k:'pend',txt:''};
}

  h+=`<div class="gridwrap"><table class="ggrid"><thead><tr><th class="gname">O‘quvchi</th>${cols.map(tk=>{const od=isOverdue(tk.date);return `<th class="gcol" title="${esc(tk.title)} · ${esc(tk.type||'')} · maks ${fmtN(Number(tk.max)||0)} ball"><div class="gdate ${tk.date===t?'gtoday':''}">${shortDate(tk.date)}</div><div class="gtitle">${esc(tk.title)}</div><button class="glink" data-act="grade" data-id="${tk.id}" title="Batafsil / tahrirlash">⋯</button>${od?'':`<div class="gdl">${shortDate(deadlineOf(tk.date))} gacha</div>`}</th>`;}).join('')}<th>O‘rtacha</th></tr></thead><tbody>`;

  h+=`</tbody></table></div></div>`;

}
// parse a grid input: % | a/b | k | q | ''
function parseCell(raw,max){
  const v=String(raw).trim().toLowerCase().replace(',','.');
  if(v==='') return {k:'clear'};
  if(v==='k'||v==='к') return {k:'abs'};
  if(v==='q'||v==='-'||v==='қ') return {k:'owe'};
  const fr=v.match(/^(\d+(?:\.\d+)?)\s*\/\s*(\d+(?:\.\d+)?)$/);
  if(fr){const a=+fr[1],b=+fr[2];if(b>0&&a<=b) return {k:'score',ball:Math.round(max*a/b*100)/100};return {k:'bad'};}
  const n=Number(v.replace('%',''));
  if(isFinite(n)&&n>=0&&n<=100) return {k:'score',ball:Math.round(max*n)/100};
  return {k:'bad'};
}
const saveQ={};let saving=0;
function setInd(txt){const el=document.getElementById('saveInd');if(el)el.textContent=txt;}
function saveCell(tid,sid,raw){
  const tk0=S.tasks.find(x=>x.id===tid);if(!tk0)return;
  const pc=parseCell(raw,Number(tk0.max)||0);
  if(pc.k==='bad'){toast('0–100 oraliqda foiz, 7/10, k yoki q yozing');return false;}
  saving++;setInd('Saqlanmoqda…');
  saveQ[tid]=(saveQ[tid]||Promise.resolve()).then(async()=>{
    const tk=S.tasks.find(x=>x.id===tid);if(!tk)return;
    const body={...tk};delete body.id;
    const scores={...(tk.scores||{})},absent={...(tk.absent||{})},owed={...(tk.owed||{})};
    delete scores[sid];delete absent[sid];delete owed[sid];
    if(pc.k==='score') scores[sid]=pc.ball; else if(pc.k==='abs') absent[sid]=true; else if(pc.k==='owe') owed[sid]=true;
    Object.assign(body,{scores,absent,owed,updated:Date.now()});
    const uid=await myId();if(uid) body.gradedBy=uid;
    const ok=await write(db=>db.doc('tasks/'+tid).set(body));
    saving--;setInd(ok?(saving?'Saqlanmoqda…':'Saqlandi ✓'):'Saqlanmadi');
  });
  return true;
}
function gridCommit(inp){
  const prev=inp.dataset.v!==undefined?inp.dataset.v:null;
  const tk=S.tasks.find(x=>x.id===inp.dataset.g);if(!tk)return;
  const cur=cellState(tk,inp.dataset.s);
  if(String(inp.value).trim().toLowerCase()===String(cur.txt).toLowerCase())return;
  saveCell(inp.dataset.g,inp.dataset.s,inp.value);
}

function addFormItem(item){
  const F=S.form;const blank=F.items.findIndex(it=>!it.title.trim());
  const it={title:item.title,type:item.type,max:item.max,manual:true};
  if(blank>=0) F.items[blank]=it; else F.items.push(it);
}
function repeatLast(){
  const F=S.form;const before=F.date||today();
  const cands=S.tasks.filter(t=>t.date<before&&(t.studentIds||[]).length>1&&(t.studentIds||[]).some(id=>isActive(S.stuById[id])&&inGroup(S.stuById[id])));
  if(!cands.length){toast('Oldingi kunlarda guruh vazifasi topilmadi');return;}
  const last=cands.reduce((m,t)=>t.date>m?t.date:m,'');
  const set=cands.filter(t=>t.date===last).sort((a,b)=>(a.created||0)-(b.created||0));
  const titles=nextTitles(set.map(t=>t.title));
  F.items=F.items.filter(it=>it.title.trim());
  set.forEach((t,i)=>F.items.push({title:titles[i],type:t.type||guessType(titles[i])||TYPES[0],max:t.max??10,manual:true,
    ids:(t.studentIds||[]).filter(id=>isActive(S.stuById[id]))}));
  if(!F.items.length) F.items=[{title:'',type:TYPES[0],max:10,manual:false}];
  toast(`${shortDate(last)} dagi ${set.length} ta vazifa o‘sha o‘quvchilari bilan qo‘shildi — tekshirib «Vazifalarni berish»ni bosing`);
  render();
}

  }

  else if(t.dataset.sf){S.sform[t.dataset.sf]=t.value;}
  else if(t.dataset.ef&&S.editStu){S.editStu[t.dataset.ef]=t.value;}
  else if(t.dataset.m&&S.modal){S.modal.d[t.dataset.m]=t.value;if(t.dataset.m==='max')S.modal.d.studentIds.forEach(updPct);}
  else if(t.dataset.sc&&S.modal){S.modal.d.scores[t.dataset.sc]=t.value;if(t.value!==''&&S.modal.d.owed[t.dataset.sc]){delete S.modal.d.owed[t.dataset.sc];document.querySelector(`[data-act=mOwe][data-id="${t.dataset.sc}"]`)?.classList.remove('on-owe');}updPct(t.dataset.sc);}
  else if(t.dataset.pp&&S.modal){const id=t.dataset.pp;const max=Number(S.modal.d.max)||0;
    if(t.value===''){S.modal.d.scores[id]='';}
    else{let p=Math.max(0,Math.min(100,Number(t.value)));const b=Math.round(max*p)/100;S.modal.d.scores[id]=String(b);if(S.modal.d.owed[id]){delete S.modal.d.owed[id];document.querySelector(`[data-act=mOwe][data-id="${id}"]`)?.classList.remove('on-owe');}}
    const inp=document.getElementById('sc_'+id);if(inp)inp.value=S.modal.d.scores[id];updPct(id);}
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.dataset.plan!=null&&S.plan){S.plan.items[Number(t.dataset.plan)].off=!t.checked;render();return;}
  if(t.classList&&t.classList.contains('gin')){gridCommit(t);return;}
  if(t.id==='c_full'&&S.card){S.card.full=t.checked;drawBestCard(document.getElementById('cardCanvas'),S.card.full);return;}
  if(t.id==='groupPick'){S.group=t.value;render();}
  else if(t.id==='anchorPick'&&t.value){S.anchor=t.value;render();}
  else if(t.dataset.act==='selStu'){t.checked?S.form.sel.add(t.dataset.id):S.form.sel.delete(t.dataset.id);
    if(S.form.mode==='each'){const sc=document.querySelector('.stlist')?.scrollTop;render();const l=document.querySelector('.stlist');if(l&&sc!=null)l.scrollTop=sc;}
    else{const lab=document.getElementById('selCount');if(lab)lab.textContent=`(${S.form.sel.size} ta tanlandi)`;}}
  else if(t.dataset.mstu&&S.modal){const id=t.dataset.mstu;const d=S.modal.d;
    if(t.checked){if(!d.studentIds.includes(id))d.studentIds.push(id);}else{d.studentIds=d.studentIds.filter(x=>x!==id);delete d.scores[id];delete d.absent[id];}
    const sc=document.querySelector('#modal .stlist')?.scrollTop;renderModal();const l=document.querySelector('#modal .stlist');if(l&&sc!=null)l.scrollTop=sc;}
  else if(t.dataset.f){S.form[t.dataset.f]=t.value;}
  else if(t.dataset.it){S.form.items[Number(t.dataset.i)][t.dataset.it]=t.value;if(t.dataset.it==='type')S.form.items[Number(t.dataset.i)].manual=true;}
  else if(t.dataset.ea){const id=t.dataset.id;S.form.each[id]=S.form.each[id]||{title:'',type:TYPES[0],max:10};S.form.each[id][t.dataset.ea]=t.value;if(t.dataset.ea==='type')S.form.each[id].manual=true;}
  else if(t.dataset.m&&S.modal){S.modal.d[t.dataset.m]=t.value;}
});
document.addEventListener('toggle',ev=>{if(ev.target.classList&&ev.target.classList.contains('more'))S.moreOpen=ev.target.open;},true);
document.addEventListener('focusin',ev=>{const t=ev.target;if(t.classList&&t.classList.contains('gin'))setTimeout(()=>{try{t.select();}catch(e){}},0);});
document.addEventListener('keydown',ev=>{
  const g=ev.target;
  if(g.classList&&g.classList.contains('gin')&&(ev.key==='Enter'||ev.key==='ArrowDown'||ev.key==='ArrowUp')){
    ev.preventDefault();gridCommit(g);
    const col=[...document.querySelectorAll(`.gin[data-c="${g.dataset.c}"]`)];const i=col.indexOf(g);
    const nx=col[i+(ev.key==='ArrowUp'?-1:1)];if(nx)nx.focus();else g.blur();return;}
  if(ev.key==='Escape'&&S.card){S.card=null;renderCard();return;}
  if(ev.key==='Escape'&&S.modal){S.modal=null;renderModal();return;}
  const t=ev.target;
  if(ev.key==='Enter'&&S.modal&&t.dataset&&t.dataset.row!=null){
    ev.preventDefault();
    if(ev.ctrlKey||ev.metaKey){document.querySelector('[data-act=mSave]')?.click();return;}
    const kind=t.dataset.sc!=null?'sc':'pp';
    const inputs=[...document.querySelectorAll(`#modal input[data-${kind}]`)].filter(x=>!x.disabled);
    const i=inputs.indexOf(t);const nx=inputs[i+1];
    if(nx){nx.focus();nx.select&&nx.select();} else {document.querySelector('[data-act=mSave]')?.focus();}
  }
});
document.getElementById('modal').addEventListener('mousedown',ev=>{if(ev.target.id==='modal'){if(S.card){S.card=null;renderCard();}else{S.modal=null;renderModal();}}});

function route(){const h=(location.hash||'#bugun').slice(1);S.view=['bugun','panel','vazifalar','oquvchilar'].includes(h)?h:'bugun';if(S.view!=='panel')S.studentId=null;render();}
window.addEventListener('hashchange',route);

/* ---------- boot ---------- */
route();
(async()=>{
  let db=null;
  try{db=window.claude&&window.claude.use?await window.claude.use('db'):null;}catch(e){db=null;}
  if(!db){S.err='Ma’lumotlar bazasi bu yerda ishlamayapti. Sahifani claude.ai’da tizimga kirgan holda oching.';render();return;}
  S.db=db;render();
  // who is viewing: delete only for editors/owner
  try{S.user=await window.claude.use('user');if(S.user){S.canDelete=!!(await S.user.canEdit());}}catch(e){S.user=null;}
  const timer=setTimeout(()=>{S.slow=true;render();},10000);
  const done=()=>{if(S.loaded.s&&S.loaded.t){clearTimeout(timer);}};
  db.collection('students').onSnapshot(snap=>{
    S.students=snap.docs.map(d=>({id:d.id,...d.data()})).filter(x=>x.name);
    S.stuById={};S.students.forEach(x=>S.stuById[x.id]=x);
    S.form.sel=new Set([...S.form.sel].filter(id=>isActive(S.stuById[id])));
    S.loaded.s=true;if(!snap.metadata.fromCache)S.slow=false;done();render();
  },e=>{S.loaded.s=true;clearTimeout(timer);S.slow=true;render();});
  db.collection('tasks').onSnapshot(snap=>{
    S.tasks=snap.docs.map(d=>({id:d.id,...d.data()})).filter(t=>t.date);
    S.loaded.t=true;if(!snap.metadata.fromCache)S.slow=false;done();render();
  },e=>{S.loaded.t=true;clearTimeout(timer);S.slow=true;render();});
})();

</script>
