<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Ilmzor</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
@font-face{font-family:Satoshi;src:url(/fonts/Satoshi-Medium.woff2) format('woff2');font-weight:500}
@font-face{font-family:Satoshi;src:url(/fonts/Satoshi-Bold.woff2) format('woff2');font-weight:700}
@font-face{font-family:Satoshi;src:url(/fonts/Satoshi-Black.woff2) format('woff2');font-weight:900}
:root{--navy:#0e223a;--navy2:#1b3a5c;--aqua:#4ad496;--bg:#f2f5f8;--card:#fff;--ink:#0e223a;--ink2:#5a6a80;--line:#e3e8ef;--ok:#13804b;--bad:#c0392b;--warn:#a15c00}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Satoshi,-apple-system,system-ui,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
header{background:var(--navy);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px}
header img{height:30px}
header .t{flex:1;min-width:0}
header .t b{display:block;font-size:17px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .t small{color:var(--aqua);font-weight:700}
header .home{border:0;background:rgba(255,255,255,.12);color:#fff;border-radius:10px;padding:7px 10px;font-weight:700}
main{padding:14px 12px 100px;max-width:720px;margin:0 auto}
.card{background:var(--card);border-radius:16px;padding:14px;box-shadow:0 2px 10px rgba(14,34,58,.07);margin-bottom:12px}
h2{font-size:19px;margin:0 0 10px;font-weight:900}
h3{font-size:16px;margin:0 0 8px;font-weight:800}
.muted{color:var(--ink2);font-size:13px}
.hello{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff}
.hello .r{display:inline-block;background:rgba(74,212,150,.18);color:var(--aqua);border-radius:8px;padding:2px 8px;font-weight:800;font-size:12px;margin-top:6px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{border:0;background:var(--card);border-radius:14px;padding:14px 6px;box-shadow:0 2px 8px rgba(14,34,58,.06);display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink);font-weight:700;font-size:13px;text-align:center;line-height:1.2}
.tile i{font-style:normal;font-size:26px}
.sec{font-weight:900;color:var(--ink2);font-size:12px;text-transform:uppercase;letter-spacing:.5px;margin:18px 4px 8px}
label{display:block;font-weight:800;font-size:13px;margin:12px 0 5px}
input,select,textarea{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:11px 12px;background:#fff;color:var(--ink);outline:0}
input:focus,select:focus,textarea:focus{border-color:var(--navy2)}
textarea{min-height:80px;resize:vertical}
.btn{border:0;border-radius:12px;padding:12px 14px;background:var(--navy);color:#fff;font-weight:800;width:100%}
.btn.aq{background:var(--aqua);color:var(--navy)}
.btn.soft{background:#e9eef5;color:var(--navy)}
.btn.bad{background:#fdeaea;color:var(--bad)}
.btn:disabled{opacity:.55}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:0;border-radius:10px;padding:8px 11px;background:#e9eef5;color:var(--navy);font-weight:700;font-size:13px}
.chip.on{background:var(--navy);color:#fff}
.err{color:var(--bad);font-size:13px;margin-top:6px;min-height:1em;white-space:pre-line}
.big{font-size:44px;font-weight:900;text-align:center;letter-spacing:3px}
.li{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);width:100%;border-left:0;border-right:0;border-top:0;background:none;text-align:left;color:var(--ink)}
.li:last-child{border-bottom:0}
.li .tx{flex:1;min-width:0}
.li .tx b{display:block;font-weight:800}
.li .tx small{color:var(--ink2)}
.pc{min-width:52px;text-align:center;border-radius:10px;padding:6px 4px;font-weight:900;color:#fff}
.q{display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid var(--line)}
.q:last-child{border-bottom:0}
.q .n{width:34px;font-weight:900;color:var(--ink2)}
.q button{flex:1;max-width:50px;height:40px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-weight:900;color:var(--navy)}
.q button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.q button.good{background:#e3f6ec;border-color:var(--ok);color:var(--ok)}
.q button.badc{background:#fdeaea;border-color:var(--bad);color:var(--bad)}
.files img{width:100%;border-radius:10px;margin-bottom:8px;display:block}
.kgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.kgrid span{background:#f2f5f8;border-radius:8px;padding:6px 0;text-align:center;font-weight:800;font-size:13px}
.bar2{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 35%);z-index:6}
.bar2 .in{max-width:720px;margin:0 auto}
.bar2 .btn{box-shadow:0 4px 14px rgba(14,34,58,.25);padding:14px}
.sgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.si{background:var(--card);border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(14,34,58,.06);display:flex;flex-direction:column}
.si .im{aspect-ratio:1;background:#e9eef5;display:flex;align-items:center;justify-content:center;font-size:36px}
.si .im img{width:100%;height:100%;object-fit:cover}
.si .b{padding:10px;display:flex;flex-direction:column;gap:6px;flex:1}
.stat{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat div{background:var(--card);border-radius:14px;padding:12px;box-shadow:0 2px 8px rgba(14,34,58,.06)}
.stat b{display:block;font-size:24px;font-weight:900}
.stat small{color:var(--ink2);font-weight:700}
.prog{height:8px;background:#e9eef5;border-radius:4px;overflow:hidden;margin-top:4px}
.prog i{display:block;height:100%;background:var(--aqua)}
.tag{display:inline-block;border-radius:8px;padding:2px 8px;font-size:12px;font-weight:800;background:#e9eef5;color:var(--navy)}
.tag.g{background:#e3f6ec;color:var(--ok)}.tag.r{background:#fdeaea;color:var(--bad)}.tag.y{background:#fff4d6;color:var(--warn)}
iframe.vz{width:100%;border:0;height:calc(100vh - 70px);display:block;border-radius:0}
.toast{position:fixed;left:50%;top:12px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:12px;z-index:50;font-weight:800;max-width:90%;text-align:center}
.load{text-align:center;color:var(--ink2);padding:50px 0}
.empty{text-align:center;color:var(--ink2);padding:24px 10px}
a{color:var(--navy2)}
</style>
</head>
<body>
<header><img src="/brand/logo-gorizontal.png" alt="ilmzor"><div class="t"><b id="ht">Ilmzor</b><small id="hs"></small></div><button class="home" id="hbtn" hidden>🏠</button></header>
<main id="app"><div class="load">Yuklanmoqda…</div></main>
<div class="bar2" id="bar" hidden></div>
<script>
(function(){
var W=window.Telegram&&Telegram.WebApp,ID=W&&W.initData||'';
try{W.ready();W.expand();W.setHeaderColor('#0e223a');W.setBackgroundColor('#f2f5f8');W.disableVerticalSwipes&&W.disableVerticalSwipes();}catch(e){}
var $=function(i){return document.getElementById(i);};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
var pcol=function(p){return 'hsl('+Math.round(Math.max(0,Math.min(100,p))*1.2)+',62%,'+(p>=50?38:44)+'%)';};
var fdt=function(ms){var d=new Date(ms);return d.getDate()+'.'+String(d.getMonth()+1).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');};
var som=function(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' ');};
function hap(t){try{t==='ok'?W.HapticFeedback.notificationOccurred('success'):t==='err'?W.HapticFeedback.notificationOccurred('error'):W.HapticFeedback.impactOccurred('light');}catch(e){}}
function say(m){try{W.showAlert(m);}catch(e){alert(m);}}
function ask(m,cb){try{W.showConfirm(m,function(y){if(y)cb();});}catch(e){if(confirm(m))cb();}}
function toast(m){var b=document.createElement('div');b.className='toast';b.textContent=m;document.body.appendChild(b);setTimeout(function(){b.remove();},2300);}
function api(op,b){b=b||{};b.initData=ID;return fetch('/app/api/'+op,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)}).then(function(r){return r.json().then(function(j){if(!r.ok){var e=new Error(j.error||'Xatolik');e.status=r.status;throw e;}return j;});});}
function upl(op,fields,files){var fd=new FormData();fd.append('initData',ID);Object.keys(fields).forEach(function(k){fd.append(k,fields[k]);});(files||[]).forEach(function(f){fd.append(f[0],f[1]);});
  return fetch('/app/api/'+op,{method:'POST',body:fd}).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error||'Xatolik');return j;});});}
function openUrl(u){var a=/^https?:/.test(u)?u:location.origin+u;try{W.openLink(a);}catch(e){window.open(a,'_blank');}}
function copy(t){try{navigator.clipboard.writeText(t);toast('📋 Nusxalandi');}catch(e){say(t);}}
function phoneReq(cb){try{W.requestContact(function(ok,res){if(!ok){cb(null);return;}var p=res&&res.responseUnsafe&&res.responseUnsafe.contact&&res.responseUnsafe.contact.phone_number;cb(p||null);});}catch(e){var p=prompt('Telefon raqamingiz (+998 …)');cb(p);}}

var S={me:null,view:'home',stack:[],d:{}};
var can=function(p){return S.me&&S.me.perms.indexOf(p)>=0;};
var VIEWS={};
function go(v,push){if(push!==false&&S.view!==v)S.stack.push(S.view);S.view=v;window.scrollTo(0,0);render();}
function back(){var v=S.stack.pop()||'home';S.view=v;render();}
function bar(h){var b=$('bar');if(h){b.hidden=false;b.innerHTML='<div class="in">'+h+'</div>';}else{b.hidden=true;b.innerHTML='';}}
function render(){var v=VIEWS[S.view]||VIEWS.home;bar('');$('app').style.padding=S.view==='vaz'?'0':'';var r=v();$('app').innerHTML=typeof r==='string'?r:'';
  $('hbtn').hidden=S.view==='home'||S.view==='name'||S.view==='sub';
  try{if(S.view==='home'||S.view==='name'||S.view==='sub')W.BackButton.hide();else W.BackButton.show();}catch(e){}
  if(v.after)v.after();}
function load(key,op,b,force){if(S.d[key]&&!force)return S.d[key];S.d[key]=null;api(op,b).then(function(j){S.d[key]=j;render();}).catch(function(e){S.d[key]={error:e.message};render();});return null;}
function errBox(j){return j&&j.error?'<div class="card empty">⚠️ '+esc(j.error)+'</div>':'';}
function L(){return '<div class="load">Yuklanmoqda…</div>';}

// ---------- bosh sahifa
var TILES=[
  ['test','✍️','Test topshirish'],['mine','📊','Natijalarim'],['vaz','📝','Vazifalar va reyting'],['shop','🛍','Ilmzor puli do‘koni'],
  ['olymp','🏆','Olimpiada natijalari'],['courses','🎓','Kurslarga yozilish'],['profile','👤','Profil']];
var STAFF=[
  ['tt','📚','Testlarim','tests'],['tt_new','➕','Yangi test','tests'],['mgroups','🗓','Oylik natijalar','monthly'],['radm','🏆','Natijalar (admin)','results'],
  ['funnel','📊','Sotuv varonkasi','funnel'],['cadm','🎓','Kurslar (admin)','courses'],['bcast','📢','Xabar yuborish','bcast'],['stats','📈','Statistika','stats'],['staff','👥','Xodimlar va kodlar','invite']];
VIEWS.home=function(){var m=S.me;var st=STAFF.filter(function(t){return can(t[3]);});
  return '<div class="card hello"><div style="font-size:13px;opacity:.8">Assalomu alaykum</div><div style="font-size:21px;font-weight:900">'+esc(m.name||m.tgName)+'</div><span class="r">'+esc(m.roleName)+'</span></div>'+
  (st.length?'<div class="sec">Ish joyi</div><div class="tiles">'+st.map(function(t){return '<button class="tile" data-go="'+t[0]+'"><i>'+t[1]+'</i>'+t[2]+'</button>';}).join('')+'</div><div class="sec">Oʻquvchi boʻlimlari</div>':'')+
  '<div class="tiles">'+TILES.map(function(t){return '<button class="tile" data-go="'+t[0]+'"><i>'+t[1]+'</i>'+t[2]+'</button>';}).join('')+'</div>'+
  '<p class="muted" style="text-align:center;margin-top:18px">🌱 Ilmzor — bilim bogʻingiz</p>';};
VIEWS.name=function(){return '<div class="card"><h2>👋 Xush kelibsiz!</h2><p class="muted">Ustozlar natijangizni taniy olishi uchun <b>ism va familiyangizni</b> yozing.</p><input id="nm" placeholder="Masalan: Ali Valiyev" value="'+esc(S.me.tgName||'')+'"><div class="err" id="er"></div><br><button class="btn" id="nmok">Saqlash</button></div>';};
VIEWS.sub=function(){return '<div class="card" style="text-align:center"><div style="font-size:48px">📢</div><h2>Kanalga obuna boʻling</h2><p class="muted">Ilovadan foydalanish uchun <b>Ilmzor oʻquv markazi</b> kanaliga obuna boʻling — eʼlonlar, natijalar va foydali materiallar shu yerda.</p><button class="btn aq" id="subgo">📢 Kanalga oʻtish</button><br><br><button class="btn" id="subchk">✅ Obuna boʻldim</button></div>';};

// ---------- test topshirish
VIEWS.test=function(){var T=S.d.T;
  if(!T)return '<div class="card"><h2>✍️ Test topshirish</h2><p class="muted">Ustozingiz bergan <b>4 belgili test kodini</b> yozing.</p><input id="tcode" maxlength="4" placeholder="A7K3" style="text-transform:uppercase;font-size:24px;text-align:center;letter-spacing:6px;font-weight:900" autocomplete="off"><div class="err" id="er"></div><br><button class="btn" id="topen">Testni ochish</button></div>';
  if(T.done)return '<div class="card" style="text-align:center"><h2>'+esc(T.title)+'</h2><p>Siz bu testni topshirgansiz:</p><div class="big" style="color:'+pcol(T.done.pct)+'">'+T.done.pct+'%</div><p><b>'+T.done.ok+' / '+T.done.n+'</b></p>'+(T.canReveal?'<button class="btn" data-rev="'+T.code+'">📋 Javoblar va reyting</button>':'<p class="muted">Test yopilgach toʻgʻri javoblar va reyting koʻrinadi.</p>')+'<br><br><button class="btn soft" id="tnew">Boshqa test</button></div>';
  if(T.result){var R=T.result;return '<div class="card" style="text-align:center"><div style="font-size:44px">'+(R.pct>=90?'🏆':R.pct>=70?'👏':R.pct>=50?'🙂':'📚')+'</div><h2>Natijangiz</h2><div class="big" style="color:'+pcol(R.pct)+'">'+R.pct+'%</div><p><b>'+R.ok+' / '+R.n+'</b> · '+esc(R.title)+'</p>'+(R.wrong.length?'<p class="muted">❌ Xato savollar: '+R.wrong.join(', ')+'</p>':'<p>✅ Hammasi toʻgʻri! Barakalla!</p>')+'<p class="muted">Test yopilgach toʻgʻri javoblar va reytingni «📊 Natijalarim»da koʻrasiz.</p><button class="btn soft" id="tnew">Boshqa test</button></div>';}
  var n=T.n,A=T.ans,L=['A','B','C','D'];var h='<div class="card"><h2>'+esc(T.title)+'</h2><div class="muted">'+n+' ta savol'+(T.deadline?' · ⏰ muddat: <b>'+fdt(T.deadline)+'</b>':'')+'</div></div>';
  if(T.files.length)h+='<div class="card files"><h3>📄 Test</h3>'+T.files.map(function(f,i){return f.type==='photo'?'<img src="'+f.url+'" alt="">':'<button class="btn soft" style="margin-bottom:8px" data-open="'+esc(f.url)+'">📄 PDF faylni ochish ('+(i+1)+')</button>';}).join('')+'</div>';
  h+='<div class="card"><h3>✍️ Javob varagʻi</h3><p class="muted" style="margin-top:0">Har bir savolga javobni belgilang. Javob faqat bir marta qabul qilinadi.</p>';
  for(var i=0;i<n;i++)h+='<div class="q"><span class="n">'+(i+1)+'.</span>'+L.map(function(l){return '<button class="'+(A[i]===l.toLowerCase()?'on':'')+'" data-ans="'+i+':'+l.toLowerCase()+'">'+l+'</button>';}).join('')+'</div>';
  h+='</div>';var cnt=A.filter(Boolean).length;
  setTimeout(function(){bar('<button class="btn aq" id="tsub" '+(cnt===n?'':'disabled')+'>✅ Yuborish · '+cnt+' / '+n+'</button>');},0);
  return h;};

// ---------- natijalarim
VIEWS.mine=function(){var j=load('mine','t_mine');if(!j)return L();if(j.error)return errBox(j);
  if(!j.results.length)return '<div class="card empty">Hali test topshirmagansiz.<br><br><button class="btn" data-go="test">✍️ Test topshirish</button></div>';
  var avg=Math.round(j.results.reduce(function(s,r){return s+r.pct;},0)/j.results.length);
  return '<div class="card"><h2>📊 Natijalarim</h2><div class="muted">Oʻrtacha: <b>'+avg+'%</b> · '+j.results.length+' ta test</div><div class="prog"><i style="width:'+avg+'%"></i></div></div><div class="card">'+
  j.results.map(function(r){return '<button class="li" '+(r.reveal?'data-rev="'+r.code+'"':'')+'><span class="pc" style="background:'+pcol(r.pct)+'">'+r.pct+'%</span><span class="tx"><b>'+esc(r.title)+'</b><small>'+r.code+' · '+r.ok+'/'+r.n+' · '+fdt(r.at)+(r.reveal?' · 📋 javoblar':'')+'</small></span></button>';}).join('')+'</div>';};
VIEWS.reveal=function(){var j=S.d.rev;if(!j)return L();if(j.error)return errBox(j);
  var h='<div class="card"><h2>📋 '+esc(j.title)+'</h2><div class="muted">'+j.code+' · '+j.count+' kishi · oʻrtacha <b>'+j.avg+'%</b></div></div>';
  if(j.me)h+='<div class="card" style="text-align:center"><div class="muted">Sizning natijangiz</div><div class="big" style="color:'+pcol(j.me.pct)+'">'+j.me.pct+'%</div><b>'+j.me.rank+'-oʻrin</b> ('+j.count+' kishidan) · '+j.me.ok+'/'+j.me.n+'</div>';
  h+='<div class="card"><h3>🏆 Reyting</h3>'+j.top.map(function(r,i){return '<div class="li"><span style="width:30px;font-size:18px">'+['🥇','🥈','🥉','4.','5.'][i]+'</span><span class="tx"><b>'+esc(r.name)+'</b></span><b>'+r.pct+'%</b></div>';}).join('')+'</div>';
  h+='<div class="card"><h3>🔑 Javoblar'+(j.me?' va xatolaringiz':'')+'</h3><div class="kgrid">'+j.key.split('').map(function(k,i){var a=j.me?j.me.answers[i]:null;var ok=!j.me||a===k;return '<span style="'+(ok?'':'background:#fdeaea;color:var(--bad)')+'">'+(i+1)+'. '+k.toUpperCase()+(ok||!a||a==='-'?'':' <s>'+a.toUpperCase()+'</s>')+'</span>';}).join('')+'</div></div>';
  return h;};

// ---------- vazifalar (oʻquvchi sahifasi)
VIEWS.vaz=function(){return '<iframe class="vz" src="/app/men"></iframe>';};

// ---------- do'kon
VIEWS.shop=function(){var j=load('shop','shop');if(!j)return L();if(j.error)return errBox(j);
  var h='<div class="card"><h2>🛍 Ilmzor puli doʻkoni</h2>'+(j.balance!==null?'<div style="font-size:15px">🪙 Balansingiz: <b style="font-size:22px">'+j.balance+'</b> Ilmzor puli</div>':'<div class="muted">Xarid qilish uchun avval <b>«📝 Vazifalar»</b> boʻlimida ism-familiyangiz bilan ulaning.</div>')+'</div>';
  var pend=j.orders.filter(function(o){return o.status==='kutilmoqda';});
  if(j.orders.length)h+='<div class="card"><h3>📦 Buyurtmalarim</h3>'+j.orders.slice(0,8).map(function(o){return '<div class="li"><span class="tx"><b>'+esc(o.name)+'</b><small>'+o.cost+' 🪙 · '+({kutilmoqda:'⏳ sotuvchidan olib keting',berildi:'✅ berildi',bekor:'✖ bekor qilindi'}[o.status]||o.status)+'</small></span>'+(o.status==='kutilmoqda'?'<button class="chip" data-scancel="'+o.id+'">Bekor</button>':'')+'</div>';}).join('')+'</div>';
  if(!j.items.length)return h+'<div class="card empty">Hozircha doʻkonda mahsulot yoʻq.</div>';
  var cats={};j.items.forEach(function(i){(cats[i.category]=cats[i.category]||[]).push(i);});

  '<div class="card"><h3>➕ Yangi kurs</h3><input data-cf="title" placeholder="Kurs nomi: Tezkor matematika, 2-3-sinf" value="'+esc(C.title||'')+'"><input data-cf="price" style="margin-top:8px" placeholder="Narxi: 300 000 soʻm/oy" value="'+esc(C.price||'')+'"><textarea data-cf="info" style="margin-top:8px" placeholder="Jadval va ustoz: Du-Chor-Ju 15:00, Sardorbek ustoz">'+esc(C.info||'')+'</textarea><button class="btn aq" style="margin-top:8px" id="cadd">➕ Qoʻshish</button></div>';};
VIEWS.stats=function(){var j=load('stats','stats');if(!j)return L();if(j.error)return errBox(j);
  var p=j.users?Math.round(j.phones*100/j.users):0;
  return '<div class="card"><h2>📈 Statistika</h2></div><div class="stat">'+[['👥 Foydalanuvchilar',j.users],['🎓 Oʻquvchilar',j.students],['👨‍🏫 Xodimlar',j.staff],['📱 Raqam ulagan',j.phones+' · '+p+'%'],['📝 Testlar',j.tests],['✍️ Topshirishlar',j.results],['📅 7 kunda topshirildi',j.week],['🗓 Oylik natijasi bor',j.monthly],['🎓 Arizalar',j.leads],['💰 Toʻlaganlar',j.paid],['📤 Navbatdagi xabarlar',j.outbox]].map(function(x){return '<div><small>'+x[0]+'</small><b>'+x[1]+'</b></div>';}).join('')+'</div>';};
VIEWS.bcast=function(){var j=load('bg','b_groups');if(!j)return L();if(j.error)return errBox(j);var B=S.d.bf;
  return '<div class="card"><h2>📢 Xabar yuborish</h2><label>Xabar matni</label><textarea id="btext" style="min-height:120px" placeholder="Eʼlon matni…">'+esc(B.text)+'</textarea><label>Rasm (ixtiyoriy)</label><input type="file" id="bfile" accept="image/*">'+
  '<label>Kimga?</label><div class="chips">'+[['all','👥 Hammaga · '+j.counts.all],['stu','🎓 Oʻquvchilarga · '+j.counts.stu],['tea','👨‍🏫 Xodimlarga · '+j.counts.tea],['grp','🗓 Guruh boʻyicha']].map(function(x){return '<button class="chip'+(B.target===x[0]?' on':'')+'" data-bt="'+x[0]+'">'+x[1]+'</button>';}).join('')+'</div>'+
  (B.target==='grp'?'<label>Guruh</label><select id="bgrp"><option value="">— tanlang —</option>'+j.groups.map(function(g){return '<option'+(B.grp===g.grp?' selected':'')+'>'+esc(g.grp)+'</option>';}).join('')+'</select><div class="muted">Faqat botda raqamini ulagan oʻquvchi va ota-onalarga boradi.</div>':'')+
  '<div class="err" id="er"></div><button class="btn aq" id="bsend">📢 Yuborish</button></div>';};
VIEWS.staff=function(){var j=load('staff','staff');if(!j)return L();if(j.error)return errBox(j);var I=S.d.ivf;
  var h='';if(can('invite'))h+='<div class="card"><h2>🔑 Xodim kodi</h2><p class="muted" style="margin-top:0">Kod bir martalik. Xodim botda <code>/ustoz KOD</code> deb yozadi.</p><div class="chips">'+[['teacher','👨‍🏫 Ustoz'],['admin','🛡 Admin']].map(function(x){return '<button class="chip'+(I.role===x[0]?' on':'')+'" data-ivr="'+x[0]+'">'+x[1]+'</button>';}).join('')+'</div><div class="row" style="margin-top:8px"><input id="ivn" placeholder="Xodim ismi" value="'+esc(I.name||'')+'" style="flex:3"><button class="chip" id="ivok">Kod olish</button></div>'+
    (j.invites.length?j.invites.map(function(i){return '<div class="li"><span class="tx"><b>'+(i.role==='admin'?'🛡 ':'👨‍🏫 ')+esc(i.name)+'</b><small>'+(i.used?'✅ ishlatilgan':'⏳ kutilmoqda')+'</small></span>'+(i.used?'':'<button class="chip" data-copy="/ustoz '+i.code+'">'+i.code+' 📋</button>')+'</div>';}).join(''):'')+'</div>';
  if(can('staff'))h+='<div class="card"><h2>👥 Xodimlar</h2>'+j.staff.map(function(s){return '<div class="li"><span class="tx"><b>'+esc(s.name)+'</b><small>'+({ceo:'👑 CEO',admin:'🛡 Admin',teacher:'👨‍🏫 Ustoz'}[s.role]||s.role)+(s.phone?' · '+esc(s.phone):'')+'</small></span>'+(s.role==='ceo'||s.me?'':'<select data-srole="'+s.id+'" style="width:auto;padding:6px"><option value="">Rol…</option><option value="admin">🛡 Admin</option><option value="teacher">👨‍🏫 Ustoz</option><option value="student">🎓 Oʻquvchi</option></select>')+'</div>';}).join('')+'</div>';
  return h;};

// ---------- hodisalar
document.addEventListener('click',function(e){var t=e.target.closest('button,[data-open]');if(!t)return;var d=t.dataset;
  if(t.id==='hbtn'){S.stack=[];go('home',false);return;}
  if(d.go){if(d.go==='tt_new')S.d.tf={files:[],key:'',title:''};if(d.go==='test')S.d.T=null;if(d.go==='courses')S.d.vj=false;if(d.go==='funnel')S.d.fl=undefined;go(d.go);return;}
  if(d.home){S.stack=[];go('home',false);return;}
  if(d.open){openUrl(d.open);return;}
  if(d.copy){copy(d.copy);return;}
  if(t.id==='nmok'||t.id==='pnmok'){var v=$(t.id==='nmok'?'nm':'pnm').value;t.disabled=true;api('set_name',{name:v}).then(function(j){S.me.name=j.name;hap('ok');toast('✅ Saqlandi');if(S.view==='name')go('home',false);else t.disabled=false;}).catch(function(e){t.disabled=false;$('er').textContent=e.message;});return;}
  if(t.id==='subgo'){try{W.openTelegramLink(S.me.subUrl);}catch(_){openUrl(S.me.subUrl);}return;}
  if(t.id==='subchk'){api('sub_check').then(function(j){if(j.sub){S.me.sub=true;go(S.me.name?'home':'name',false);}else say('❌ Hali obuna boʻlmagansiz. Avval «Kanalga oʻtish»ni bosing.');});return;}
  if(t.id==='pph'){phoneReq(function(p){if(!p)return;api('set_phone',{phone:p}).then(function(j){S.me.phone=j.phone;hap('ok');say('✅ Raqam ulandi!'+(j.monthly?'\n🗓 Oylik natijalar topildi — «Vazifalar va reyting» boʻlimida.':''));render();}).catch(function(e){say(e.message);});});return;}
  // test
  if(t.id==='topen'){var c=$('tcode').value.trim();t.disabled=true;api('t_open',{code:c}).then(function(j){j.ans=new Array(j.n||0).fill('');S.d.T=j;hap();render();}).catch(function(e){t.disabled=false;$('er').textContent=e.message;hap('err');});return;}
  if(d.ans){var p=d.ans.split(':'),T=S.d.T;T.ans[+p[0]]=T.ans[+p[0]]===p[1]?'':p[1];hap();var y=window.scrollY;render();window.scrollTo(0,y);return;}
  if(t.id==='tsub'){var T2=S.d.T;ask('Javoblarni yuborasizmi? Javob faqat bir marta qabul qilinadi.',function(){t.disabled=true;api('t_submit',{code:T2.code,answers:T2.ans.join('')}).then(function(j){T2.result=j;hap('ok');S.d.mine=null;go('test',false);window.scrollTo(0,0);}).catch(function(e){t.disabled=false;say(e.message);});});return;}
  if(t.id==='tnew'){S.d.T=null;render();return;}
  if(d.rev){S.d.rev=null;go('reveal');api('t_reveal',{code:d.rev}).then(function(j){S.d.rev=j;render();}).catch(function(e){S.d.rev={error:e.message};render();});return;}
  // do'kon
  if(d.buy){var it=S.d.shop.items.filter(function(x){return x.id===d.buy;})[0];ask('🛒 '+it.name+' — '+it.price+' Ilmzor puli. Olasizmi? Pul darhol band qilinadi.',function(){api('s_order',{id:it.id}).then(function(j){hap('ok');say('✅ Buyurtma qabul qilindi!\n🪙 Qolgan balans: '+j.balance+'\n📍 Mahsulotni doʻkon sotuvchisidan olib keting.');load('shop','shop',{},true);render();}).catch(function(e){say(e.message);});});return;}
  if(d.scancel){ask('Buyurtmani bekor qilasizmi? Pul qaytadi.',function(){api('s_cancel',{id:d.scancel}).then(function(){toast('✖ Bekor qilindi');load('shop','shop',{},true);render();}).catch(function(e){say(e.message);});});return;}
  // olimpiada
  if(d.oset){S.d.oid=+d.oset;S.d.ofind=null;go('oset');return;}
  if(t.id==='ofgo'){var q=$('ofn').value;S.d.ofq=q;t.disabled=true;api('o_find',{setid:S.d.oid,name:q}).then(function(j){S.d.ofind=j;render();}).catch(function(e){t.disabled=false;$('er').textContent=e.message;});return;}
  if(d.vjoin){S.d.vj=true;S.d.courses=null;go('courses');return;}
  if(d.vused){api('vused',{k:d.vused,used:d.u==='1'}).then(function(){toast('Saqlandi');$('ofgo')&&$('ofgo').click();});return;}
  // kurslar
  if(d.course){S.d.cid=+d.course;S.d.lf={student:S.me.name||'',subject:'',shift:'',grade:'',err:''};go('course');return;}
  if(d.lsub){S.d.lf.subject=d.lsub;render();return;}
  if(d.lshift){S.d.lf.shift=d.lshift;render();return;}
  if(d.lgrade){S.d.lf.grade=d.lgrade;render();return;}
  if(t.id==='lsend'){var F=S.d.lf;var sendLead=function(){t.disabled=true;api('lead',{course:S.d.cid,student:F.student,subject:F.subject,shift:F.shift,grade:F.grade,voucher:!!S.d.vj}).then(function(){hap('ok');S.d.courses=null;S.stack=[];go('leaddone',false);}).catch(function(e){t.disabled=false;
      if(e.status===428){phoneReq(function(p){if(!p){F.err='Telefon raqam majburiy — admin siz bilan bogʻlanishi uchun.';render();return;}api('set_phone',{phone:p}).then(function(j){S.me.phone=j.phone;sendLead();}).catch(function(e2){say(e2.message);});});return;}
      F.err=e.message;render();hap('err');});};sendLead();return;}
  // ustoz
  if(d.tt){S.d.tv=null;go('tt_view');api('tt_get',{code:d.tt}).then(function(j){S.d.tv=j;render();}).catch(function(e){S.d.tv={error:e.message};render();});return;}
  if(t.id==='tcreate'){var TF=S.d.tf;TF.key=$('tkey').value;TF.title=$('ttitle').value;if(!TF.files.length){$('er').textContent='Test faylini tanlang';return;}if(!keyLen(TF.key)){$('er').textContent='Javoblar kalitini yozing';return;}
    t.disabled=true;t.textContent='⏳ Yuklanmoqda…';upl('tt_new',{key:TF.key,title:TF.title},TF.files.map(function(f){return['files',f];})).then(function(j){hap('ok');S.d.tt=null;S.d.tv=null;S.stack=['home','tt'];S.view='tt_view';render();api('tt_get',{code:j.code}).then(function(x){S.d.tv=x;render();});}).catch(function(e){t.disabled=false;t.textContent='✅ Testni yaratish';$('er').textContent=e.message;});return;}
  if(d.tset){var J=S.d.tv,body={code:J.code};if(d.tset==='title')body.title=$('ett').value;else if(d.tset==='key')body.key=$('ekey').value;else if(d.tset==='hours')body.hours=+d.v;else body[d.tset]=d.v==='1';
    api('tt_set',body).then(function(j){S.d.tv=j;S.d.tt=null;hap('ok');toast('✅ Saqlandi');render();}).catch(function(e){say(e.message);});return;}
  if(t.id==='texp'){api('tt_export',{code:S.d.tv.code}).then(function(j){say('📤 Natijalar fayli bot chatiga yuborildi.\n\nGoogle Sheets uchun formula nusxalandi — yangi jadvalning A1 katagiga qoʻying.');copy('=IMPORTDATA("'+j.url+'")');}).catch(function(e){say(e.message);});return;}
  if(t.id==='tdel'){ask('Test va uning barcha natijalari oʻchirilsinmi? Bu qaytarilmaydi.',function(){api('tt_del',{code:S.d.tv.code}).then(function(){S.d.tt=null;toast('🗑 Oʻchirildi');back();}).catch(function(e){say(e.message);});});return;}
  // natijalar admin
  var rr=function(op,b){return api(op,b).then(function(j){S.d.radm=j;S.d.olymp=null;hap('ok');render();}).catch(function(e){say(e.message);});};
  if(t.id==='rnewok'){rr('r_newset',{title:$('rnew').value});return;}
  if(d.rtog){rr('r_toggle',{id:+d.rtog});return;}
  if(d.rdel){ask('Toʻplam va uning fayllari oʻchirilsinmi?',function(){rr('r_del',{id:+d.rdel});});return;}
  if(d.ridel){ask('Fayl oʻchirilsinmi?',function(){rr('r_itemdel',{id:+d.ridel});});return;}
  if(d.rlock){rr('r_lock',{id:+d.rlock,mode:d.m});return;}
  if(d.rlockat){var inp=document.querySelector('[data-rat="'+d.rlockat+'"]');if(!inp.value){say('Sana va vaqtni tanlang');return;}rr('r_lock',{id:+d.rlockat,mode:'at',at:new Date(inp.value).getTime()});return;}
  if(d.radd){var sid=d.radd,A=S.d.ra[sid]||{},fi=document.querySelector('[data-rf="'+sid+'"]');if(!fi.files[0]){say('Natija faylini tanlang');return;}t.disabled=true;t.textContent='⏳ Yuklanmoqda…';
    upl('r_item',{setid:sid,label:A.label||'',csv:A.csv||''},[['file',fi.files[0]]]).then(function(j){S.d.radm=j;S.d.ra[sid]={};S.d.olymp=null;hap('ok');toast('✅ Qoʻshildi');render();}).catch(function(e){t.disabled=false;t.textContent='Qoʻshish';say(e.message);});return;}
  // varonka
  if(d.fst){S.d.fst=d.fst;S.d.fl=undefined;render();return;}
  if(d.la||d.ls){api('f_act',d.la?{id:+d.la,assign:1}:{id:+d.ls,stage:d.s}).then(function(){hap('ok');toast('✅ Saqlandi');S.d.fs=null;S.d.fl=undefined;load('fs','f_sum',{},true);render();}).catch(function(e){say(e.message);});return;}
  // kurslar admin
  var cc=function(op,b){api(op,b).then(function(j){S.d.cadm=j;S.d.courses=null;hap('ok');render();}).catch(function(e){say(e.message);});};
  if(d.ctog){cc('c_toggle',{id:+d.ctog});return;}
  if(d.cdel){ask('Kurs oʻchirilsinmi? Avvalgi arizalar saqlanib qoladi.',function(){cc('c_del',{id:+d.cdel});});return;}
  if(t.id==='cadd'){cc('c_add',S.d.cf);S.d.cf={};return;}
  // xabar
  if(d.bt){S.d.bf.text=$('btext').value;S.d.bf.target=d.bt;render();return;}
  if(t.id==='bsend'){var BF=S.d.bf;BF.text=$('btext').value;if($('bgrp'))BF.grp=$('bgrp').value;var f=$('bfile').files[0];
    if(!BF.target){$('er').textContent='Kimga yuborishni tanlang';return;}
    ask('Xabar yuborilsinmi?',function(){t.disabled=true;var pr=f?upl('b_send',{text:BF.text,target:BF.target,grp:BF.grp||''},[['file',f]]):api('b_send',{text:BF.text,target:BF.target,grp:BF.grp||''});
      pr.then(function(j){hap('ok');S.d.bf={text:'',target:'',grp:''};say('⏳ Xabar '+j.total+' kishiga yuborish navbatiga qoʻyildi. Taxminan '+j.minutes+' daqiqada tugaydi, oxirida botga hisobot keladi.');render();}).catch(function(e){t.disabled=false;$('er').textContent=e.message;});});return;}
  // xodimlar
  if(d.ivr){S.d.ivf.role=d.ivr;S.d.ivf.name=$('ivn').value;render();return;}
  if(t.id==='ivok'){var I=S.d.ivf;I.name=$('ivn').value;api('iv_new',{role:I.role||'teacher',name:I.name}).then(function(j){S.d.staff=j;S.d.ivf={role:I.role};hap('ok');var c=j.invites[0];copy('/ustoz '+c.code);say('✅ '+c.name+' uchun kod: '+c.code+'\n\nXodim botda shuni yozadi:\n/ustoz '+c.code+'\n\n(nusxalandi)');render();}).catch(function(e){say(e.message);});return;}
});
document.addEventListener('input',function(e){var t=e.target,d=t.dataset;
  if(t.id==='tcode'){t.value=t.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,4);return;}
  if(d.lf){S.d.lf[d.lf]=t.value;return;}
  if(t.id==='tkey'){S.d.tf.key=t.value;var n=keyLen(t.value);$('tkn').textContent=n?n+' ta savol':'';return;}
  if(t.id==='ttitle'){S.d.tf.title=t.value;return;}
  if(d.ra){S.d.ra[d.ra]=S.d.ra[d.ra]||{};S.d.ra[d.ra][d.k]=t.value;return;}
  if(d.cf){S.d.cf[d.cf]=t.value;return;}
  if(t.id==='btext'){S.d.bf.text=t.value;return;}
});
document.addEventListener('change',function(e){var t=e.target;
  if(t.id==='tfiles'){S.d.tf.files=[].slice.call(t.files);$('tfn').textContent=S.d.tf.files.length+' ta fayl tanlandi';return;}
  if(t.dataset.srole&&t.value){var id=+t.dataset.srole,r=t.value;ask('Rol oʻzgartirilsinmi?',function(){api('s_role',{id:id,role:r}).then(function(j){S.d.staff=j;toast('✅ Oʻzgartirildi');render();}).catch(function(e2){say(e2.message);});});t.value='';return;}
});
try{W.BackButton.onClick(function(){back();});}catch(e){}

S.d.ra={};S.d.cf={};S.d.bf={text:'',target:'',grp:''};S.d.ivf={role:'teacher'};S.d.tf={files:[],key:'',title:''};S.d.lf={};
if(!ID){$('app').innerHTML='<div class="card empty">Bu ilova Telegram ichida ochiladi.<br><br><a href="https://t.me/ilmzor_test_bot">@ilmzor_test_bot</a> → «📱 Ilova»</div>';return;}
api('me').then(function(m){S.me=m;$('hs').textContent=m.roleName;
  if(!m.sub){S.view='sub';render();return;}
  if(!m.name){S.view='name';render();return;}
  var h=location.hash.slice(1);if(h&&VIEWS[h]){S.stack=['home'];if(h==='funnel')S.d.fl=undefined;S.view=h;}render();
}).catch(function(e){$('app').innerHTML='<div class="card empty">⚠️ '+esc(e.message)+'<br><br><button class="btn" onclick="location.reload()">Qayta urinish</button></div>';});
})();
</script>
